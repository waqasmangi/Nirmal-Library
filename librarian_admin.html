<!-- Chosen Palette: Teal, Amber, Stone (Minimal and Educational) -->
<!-- Application Structure Plan: Dedicated Admin Dashboard with client-side password protection. Structure includes a persistent Form for CRUD operations (Add/Edit) and a Live Table (Book Inventory) with Delete/Edit buttons. Search function added for usability. Focus is on quick data management. -->
<!-- Visualization & Content Choices: Login Screen (Report Info -> Security -> Simple Form + JS Validation -> Password input for access control -> Vanilla JS/HTML). Book Inventory (Report Info -> Organize -> Live Table + Search -> CRUD actions for management -> Firestore/Vanilla JS). CONFIRMATION: NO SVG graphics used. NO Mermaid JS used. -->
<!DOCTYPE html>
<html lang="sd" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>لائبريري انتظاميا پينل</title>
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Custom Font: MB Lateefi.otf (CORRECTED) -->
    <style>
        @font-face {
            font-family: 'MBLateefi';
            src: url('MB Lateefi.otf') format('opentype');
            font-weight: normal;
            font-style: normal;
        }
        body {
            font-family: 'MBLateefi', 'Noto Nastaliq Urdu', serif;
        }
        .latin {
            font-family: Inter, sans-serif;
        }
        .text-right-aligned {
             text-align: right;
        }
    </style>

    <!-- Firebase SDK Imports for Database Management -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getAuth, signInAnonymously } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
        import { getFirestore, collection, addDoc, query, onSnapshot, serverTimestamp, setLogLevel, doc, deleteDoc, updateDoc, orderBy } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";
        
        setLogLevel('Debug');
        
        // --- Shared Firebase Config ---
        const firebaseConfig = {
            apiKey: "AIzaSyBxgOhd3y5L7Xl_IzWkuJ02PBlswR9lt5k",
            authDomain: "nirmal-library.firebaseapp.com",
            projectId: "nirmal-library", 
            storageBucket: "nirmal-library.firebasestorage.app",
            messagingSenderId: "157338670869",
            appId: "1:157338670869:web:f44c9b0a3d9e9ebedcfb1c"
        };
        const appId = firebaseConfig.projectId;
        const ADMIN_PASSWORD = "Nirmal2025"; // !!! CRITICAL: Simple client-side password - DO NOT USE FOR SENSITIVE DATA !!!
        // --- End Shared Firebase Config ---
        
        let db;
        let auth;
        let inventoryData = []; // Global storage for all books
        let currentBookIdToEdit = null; // State to track which book is being edited

        window.checkPassword = function() {
            const inputPassword = document.getElementById('password-input').value;
            const status = document.getElementById('login-status');
            
            if (inputPassword === ADMIN_PASSWORD) {
                document.getElementById('login-screen').classList.add('hidden');
                document.getElementById('admin-content').classList.remove('hidden');
                initFirebaseAndAuth();
            } else {
                status.textContent = 'غلط پاسورڊ. ٻيهر ڪوشش ڪريو.';
                status.classList.add('text-red-500');
            }
        };

        // --- Firebase Initialization and Auth ---
        async function initFirebaseAndAuth() {
            try {
                const app = initializeApp(firebaseConfig);
                db = getFirestore(app);
                auth = getAuth(app);
                
                await signInAnonymously(auth);
                
                listenForBooks(db, appId);

            } catch (error) {
                document.getElementById('status').textContent = `Firebase غلطي: ${error.code}. مهرباني ڪري چيڪ ڪريو ته Anonymous Auth چالو آهي.`;
                console.error("Firebase Auth Error:", error);
            }
        }

        window.submitBook = async function() {
            const title = document.getElementById('book-title').value.trim();
            const category = document.getElementById('book-category').value.trim();
            const status = document.getElementById('status');
            
            if (!title || !category) {
                status.textContent = 'ڪتاب جو نالو ۽ ڪيٽيگري لازمي آھن.';
                status.classList.remove('text-green-600', 'text-amber-500');
                status.classList.add('text-red-600');
                return;
            }
            status.classList.remove('text-red-600', 'text-green-600');
            status.classList.add('text-amber-500');
            status.textContent = currentBookIdToEdit ? 'تبديليون محفوظ ڪري رهيو آهي...' : 'ڪتاب جمع ڪري رهيو آهي...';


            try {
                if (currentBookIdToEdit) {
                    // EDIT MODE: Update existing document
                    await updateDoc(doc(db, `artifacts/${appId}/public/data/book_inventory`, currentBookIdToEdit), {
                        title: title,
                        category: category,
                    });
                    status.textContent = `ڪتاب "${title}" جون تبديليون ڪاميابي سان محفوظ ٿي ويون!`;
                } else {
                    // ADD MODE: Add new document
                    await addDoc(collection(db, `artifacts/${appId}/public/data/book_inventory`), {
                        title: title,
                        category: category,
                        timestamp: serverTimestamp()
                    });
                    status.textContent = `ڪتاب "${title}" ڪاميابي سان شامل ڪيو ويو!`;
                }

                status.classList.remove('text-amber-500');
                status.classList.add('text-green-600');
                
                // Reset form state
                document.getElementById('book-title').value = '';
                document.getElementById('book-category').value = '';
                window.cancelEdit(); // Reset to Add Mode

            } catch (e) {
                console.error("Error submitting book: ", e);
                status.textContent = `ڪتاب محفوظ ڪرڻ ۾ غلطي ٿي. (رول چيڪ ڪريو): ${e.message}`;
                status.classList.remove('text-amber-500', 'text-green-600');
                status.classList.add('text-red-600');
            }
        };

        window.deleteBook = async function(bookId) {
            if (confirm("ڇا توهان واقعي هن ڪتاب کي حذف ڪرڻ چاهيو ٿا؟")) {
                try {
                    await deleteDoc(doc(db, `artifacts/${appId}/public/data/book_inventory`, bookId));
                    console.log("Book deleted:", bookId);
                } catch (e) {
                    alert(`ڪتاب حذف ڪرڻ ۾ غلطي: ${e.message}`);
                    console.error("Error deleting book: ", e);
                }
            }
        };

        // NEW: Function to load data into the form for editing
        window.editBook = function(bookId) {
            const bookToEdit = inventoryData.find(book => book.id === bookId);
            if (!bookToEdit) {
                alert("ڪتاب نه ملي سگھيو!");
                return;
            }
            
            document.getElementById('book-title').value = bookToEdit.title;
            document.getElementById('book-category').value = bookToEdit.category;
            
            currentBookIdToEdit = bookId; // Set global state
            
            // Change button appearance and add Cancel button
            document.getElementById('submit-book-btn').textContent = 'تبديليون محفوظ ڪريو';
            document.getElementById('cancel-edit-btn').classList.remove('hidden');
            
            // Clear status message
            document.getElementById('status').textContent = 'ڪتاب ايڊٽ ڪرڻ لاءِ تياري...';
            document.getElementById('status').classList.remove('text-green-600', 'text-red-600');
            document.getElementById('status').classList.add('text-amber-500');

            // Scroll to form
            document.getElementById('add-book-form-card').scrollIntoView({ behavior: 'smooth' });
        };
        
        // NEW: Function to reset the form after editing or cancellation
        window.cancelEdit = function() {
            currentBookIdToEdit = null;
            document.getElementById('book-title').value = '';
            document.getElementById('book-category').value = '';
            
            // Reset button appearance
            document.getElementById('submit-book-btn').textContent = 'ڪتاب شامل ڪريو';
            document.getElementById('cancel-edit-btn').classList.add('hidden');
            document.getElementById('status').textContent = '';
        };


        function listenForBooks(db, appId) {
            const booksRef = collection(db, `artifacts/${appId}/public/data/book_inventory`);
            const q = query(booksRef, orderBy('timestamp', 'desc')); // Order by timestamp for latest first
            
            onSnapshot(q, (snapshot) => {
                // 1. Store the full data set
                inventoryData = snapshot.docs.map(doc => ({
                    id: doc.id,
                    ...doc.data(),
                    time: doc.data().timestamp ? new Date(doc.data().timestamp.toDate()).toLocaleDateString('sd-PK') : 'نامعلوم'
                }));
                // 2. Render the initial list (unfiltered)
                filterBookList(); 
            }, (error) => {
                 console.error("Error listening to books: ", error);
                 document.getElementById('book-list').innerHTML = `<tr><td colspan="5" class="p-4 text-center text-red-600">لوڊ ڪرڻ ۾ غلطي: ${error.message}</td></tr>`;
            });
        }
        
        window.filterBookList = function() {
            const searchTerm = document.getElementById('admin-search').value.toLowerCase().trim();
            const list = document.getElementById('book-list');
            list.innerHTML = '';
            
            const filteredData = inventoryData.filter(book => 
                book.title.toLowerCase().includes(searchTerm) || 
                book.category.toLowerCase().includes(searchTerm)
            );

            if (filteredData.length === 0) {
                 list.innerHTML = '<tr><td colspan="5" class="p-4 text-center text-gray-500">ڪابه ڪتاب نه ملي سگهي.</td></tr>';
                 return;
            }

            filteredData.forEach((data, index) => {
                const row = document.createElement('tr');
                row.className = index % 2 === 0 ? 'bg-white' : 'bg-gray-50';
                
                row.innerHTML = `
                    <td class="p-4">${index + 1}</td>
                    <td class="p-4 font-semibold">${data.title}</td>
                    <td class="p-4">${data.category}</td>
                    <td class="p-4 text-sm text-gray-500">${data.time}</td>
                    <td class="p-4 space-x-2 space-x-reverse flex justify-end">
                        <button onclick="window.editBook('${data.id}')" class="bg-blue-500 text-white px-3 py-1 rounded-md hover:bg-blue-600 transition-colors text-sm">ايڊٽ ڪريو</button>
                        <button onclick="window.deleteBook('${data.id}')" class="bg-red-500 text-white px-3 py-1 rounded-md hover:bg-red-600 transition-colors text-sm">حذف ڪريو</button>
                    </td>
                `;
                list.appendChild(row);
            });
        };
        
        // --- Admin Access Gate ---
        document.addEventListener('DOMContentLoaded', function() {
            const accessKey = prompt("مهرباني ڪري انتظاميا پاسورڊ داخل ڪريو:");
            if (accessKey === ADMIN_PASSWORD) {
                document.getElementById('login-screen').classList.add('hidden');
                document.getElementById('admin-content').classList.remove('hidden');
                initFirebaseAndAuth();
            } else {
                document.getElementById('login-screen').innerHTML = '<p class="text-red-500 font-bold text-2xl">غلط پاسورڊ. مهرباني ڪري ٻيهر ڪوشش ڪريو.</p>';
            }
        });

    </script>
</head>
<body class="bg-stone-50 text-gray-800 p-8">

    <!-- Login Screen -->
    <div id="login-screen" class="min-h-screen flex items-center justify-center p-4 bg-teal-800">
        <div class="bg-white p-8 rounded-lg shadow-2xl w-full max-w-md text-center">
            <h1 class="text-3xl font-bold mb-4 text-teal-700">لائبريري انتظاميا پينل</h1>
            <p class="text-gray-600 mb-6">رسائي لاءِ پاسورڊ داخل ڪريو:</p>
            <input type="password" id="password-input" class="w-full p-3 border border-gray-300 rounded-md mb-4 text-center" placeholder="پاسورڊ">
            <button onclick="window.checkPassword()" class="w-full bg-amber-500 text-white font-bold py-3 rounded-md hover:bg-amber-600 transition-colors">رسائي</button>
            <p id="login-status" class="mt-4 text-sm"></p>
            <p class="mt-6 text-sm text-teal-600"><a href="index.html" class="underline hover:text-teal-800">مکيه ويبسائيٽ ڏانهن واپس</a></p>
        </div>
    </div>

    <!-- Admin Panel (Hidden until login) -->
    <div id="admin-content" class="container mx-auto hidden">
        <header class="text-center mb-10 pb-5 border-b-2 border-teal-500">
            <h1 class="text-4xl font-bold text-teal-700">نِرمل لائبريري ڪتابن جو انتظاميا پينل</h1>
            <p class="mt-2 text-gray-600">ڪتاب شامل ڪريو ۽ فهرست کي منظم ڪريو.</p>
        </header>
        
        <div class="max-w-2xl mx-auto mb-6">
            <a href="index.html" class="text-sm text-blue-600 hover:text-blue-800 transition-colors flex items-center justify-center">← مکيه ويبسائيٽ ڏانهن واپس وڃو</a>
        </div>

        <!-- Add/Edit Book Form -->
        <div id="add-book-form-card" class="bg-white p-6 rounded-lg shadow-xl max-w-2xl mx-auto mb-10 border-t-4 border-amber-500">
            <h2 class="text-2xl font-bold mb-4 text-center">نئون ڪتاب شامل ڪريو</h2>
            <div class="mb-4">
                <label for="book-title" class="block text-right mb-2 font-medium">ڪتاب جو نالو (مثال: Basic English Grammar)</label>
                <input type="text" id="book-title" class="w-full p-2 border border-gray-300 rounded-md" placeholder="ڪتاب جو نالو">
            </div>
            <div class="mb-6">
                <label for="book-category" class="block text-right mb-2 font-medium">ڪيٽيگري (مثال: انگريزي، تاريخ، ناول)</label>
                <input type="text" id="book-category" class="w-full p-2 border border-gray-300 rounded-md" placeholder="مثال: تعليم، تاريخ، ناول، سائنس">
            </div>
            
            <div id="status" class="text-center mb-4 font-semibold text-sm"></div>

            <div class="flex space-x-2 space-x-reverse">
                <button onclick="window.submitBook()" id="submit-book-btn" class="w-full bg-teal-600 text-white font-bold py-3 rounded-md hover:bg-teal-700 transition-colors">ڪتاب شامل ڪريو</button>
                <button onclick="window.cancelEdit()" id="cancel-edit-btn" class="hidden bg-gray-400 text-white font-bold py-3 px-4 rounded-md hover:bg-gray-500 transition-colors whitespace-nowrap">منسوخ ڪريو</button>
            </div>
        </div>

        <!-- Book List Table -->
        <h2 class="text-3xl font-bold text-center mb-6 text-teal-700">موجوده ڪتابن جي فهرست</h2>
        
        <div class="max-w-4xl mx-auto mb-4">
            <input type="text" id="admin-search" onkeyup="window.filterBookList()" class="w-full p-3 border-2 border-amber-300 rounded-lg focus:border-teal-500 transition-colors" placeholder="ڪتاب ڳوليو (نالو يا ڪيٽيگري)">
        </div>
        
        <div class="overflow-x-auto bg-white rounded-lg shadow-xl">
            <table class="min-w-full divide-y divide-gray-200">
                <thead>
                    <tr>
                        <th class="p-4 bg-teal-50 text-right text-xs font-medium text-gray-500 uppercase tracking-wider">شمار</th>
                        <th class="p-4 bg-teal-50 text-right text-xs font-medium text-gray-500 uppercase tracking-wider">ڪتاب جو نالو</th>
                        <th class="p-4 bg-teal-50 text-right text-xs font-medium text-gray-500 uppercase tracking-wider">ڪيٽيگري</th>
                        <th class="p-4 bg-teal-50 text-right text-xs font-medium text-gray-500 uppercase tracking-wider">شامل ٿيڻ جي تاريخ</th>
                        <th class="p-4 bg-teal-50 text-right text-xs font-medium text-gray-500 uppercase tracking-wider">عمل</th>
                    </tr>
                </thead>
                <tbody id="book-list" class="bg-white divide-y divide-gray-200">
                    <tr><td colspan="5" class="p-4 text-center text-gray-500">لوڊ ٿي رهيو آهي...</td></tr>
                </tbody>
            </table>
        </div>
    </div>
</body>
</html>
