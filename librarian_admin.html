<!DOCTYPE html>
<html lang="sd" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>لائبريري انتظاميا پينل</title>
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Firebase SDK Imports for Database Management -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getAuth, signInAnonymously } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
        import { getFirestore, collection, addDoc, query, onSnapshot, serverTimestamp, setLogLevel, doc, deleteDoc } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";
        
        setLogLevel('Debug');
        
        // --- Shared Firebase Config ---
        const firebaseConfig = {
            apiKey: "AIzaSyBxgOhd3y5L7Xl_IzWkuJ02PBlswR9lt5k",
            authDomain: "nirmal-library.firebaseapp.com",
            projectId: "nirmal-library", 
            storageBucket: "nirmal-library.firebasestorage.app",
            messagingSenderId: "157338670869",
            appId: "1:157338670869:web:f44c9b0a3d9e9ebedcfb1c"
        };
        const appId = firebaseConfig.projectId;
        const ADMIN_PASSWORD = "Nirmal2025"; // !!! CRITICAL: Simple client-side password - DO NOT USE FOR SENSITIVE DATA !!!
        // --- End Shared Firebase Config ---
        
        let db;
        let auth;

        async function initFirebaseAndAuth() {
            try {
                const app = initializeApp(firebaseConfig);
                db = getFirestore(app);
                auth = getAuth(app);
                
                await signInAnonymously(auth);
                
                listenForBooks(db, appId);

            } catch (error) {
                document.getElementById('status').textContent = `Firebase غلطي: ${error.code}. مهرباني ڪري چيڪ ڪريو ته Anonymous Auth چالو آهي.`;
                console.error("Firebase Auth Error:", error);
            }
        }

        window.submitBook = async function() {
            const title = document.getElementById('book-title').value.trim();
            const category = document.getElementById('book-category').value.trim();
            const status = document.getElementById('status');
            
            if (!title || !category) {
                status.textContent = 'ڪتاب جو نالو ۽ ڪيٽيگري لازمي آھن.';
                status.classList.add('text-red-600');
                return;
            }
            status.classList.remove('text-red-600');
            status.textContent = 'ڪتاب جمع ڪري رهيو آهي...';

            try {
                await addDoc(collection(db, `artifacts/${appId}/public/data/book_inventory`), {
                    title: title,
                    category: category,
                    timestamp: serverTimestamp()
                });

                status.textContent = `ڪتاب "${title}" ڪاميابي سان شامل ڪيو ويو!`;
                status.classList.add('text-green-600');
                document.getElementById('book-title').value = '';
                document.getElementById('book-category').value = '';

            } catch (e) {
                console.error("Error adding book: ", e);
                status.textContent = `ڪتاب شامل ڪرڻ ۾ غلطي ٿي. (رول چيڪ ڪريو): ${e.message}`;
                status.classList.add('text-red-600');
            }
        };

        window.deleteBook = async function(bookId) {
            if (confirm("ڇا توهان واقعي هن ڪتاب کي حذف ڪرڻ چاهيو ٿا؟")) {
                try {
                    await deleteDoc(doc(db, `artifacts/${appId}/public/data/book_inventory`, bookId));
                    console.log("Book deleted:", bookId);
                } catch (e) {
                    alert(`ڪتاب حذف ڪرڻ ۾ غلطي: ${e.message}`);
                    console.error("Error deleting book: ", e);
                }
            }
        };


        function listenForBooks(db, appId) {
            const booksRef = collection(db, `artifacts/${appId}/public/data/book_inventory`);
            const q = query(booksRef); 
            
            onSnapshot(q, (snapshot) => {
                const list = document.getElementById('book-list');
                list.innerHTML = '';
                
                if (snapshot.docs.length === 0) {
                    list.innerHTML = '<tr><td colspan="4" class="p-4 text-center text-gray-500">لائبريريءَ ۾ ڪي بہ ڪتاب شامل ناهن.</td></tr>';
                    return;
                }

                snapshot.docs.forEach((doc, index) => {
                    const data = doc.data();
                    const row = document.createElement('tr');
                    row.className = index % 2 === 0 ? 'bg-white' : 'bg-gray-50';
                    
                    const time = data.timestamp ? new Date(data.timestamp.toDate()).toLocaleDateString('sd-PK') : 'نامعلوم';

                    row.innerHTML = `
                        <td class="p-4">${index + 1}</td>
                        <td class="p-4 font-semibold">${data.title}</td>
                        <td class="p-4">${data.category}</td>
                        <td class="p-4 text-sm text-gray-500">${time}</td>
                        <td class="p-4">
                            <button onclick="window.deleteBook('${doc.id}')" class="bg-red-500 text-white px-3 py-1 rounded-md hover:bg-red-600 transition-colors text-sm">حذف ڪريو</button>
                        </td>
                    `;
                    list.appendChild(row);
                });
            }, (error) => {
                 console.error("Error listening to books: ", error);
                 document.getElementById('book-list').innerHTML = `<tr><td colspan="4" class="p-4 text-center text-red-600">لوڊ ڪرڻ ۾ غلطي: ${error.message}</td></tr>`;
            });
        }
        
        // --- Admin Access Gate ---
        document.addEventListener('DOMContentLoaded', function() {
            const accessKey = prompt("مهرباني ڪري انتظاميا پاسورڊ داخل ڪريو:");
            if (accessKey === ADMIN_PASSWORD) {
                document.getElementById('login-gate').classList.add('hidden');
                document.getElementById('admin-content').classList.remove('hidden');
                initFirebaseAndAuth();
            } else {
                document.getElementById('login-gate').innerHTML = '<p class="text-red-500 font-bold text-2xl">غلط پاسورڊ. مهرباني ڪري ٻيهر ڪوشش ڪريو.</p>';
            }
        });

    </script>
    
    <link href="https://fonts.googleapis.com/css2?family=Noto+Nastaliq+Urdu:wght@400;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Noto Nastaliq Urdu', serif; }
    </style>
</head>
<body class="bg-stone-50 text-gray-800 p-8">

    <div id="login-gate" class="flex justify-center items-center h-screen text-center">
        <p class="text-xl text-gray-600">انتظاميا پينل لوڊ ٿي رهيو آهي...</p>
    </div>

    <div id="admin-content" class="container mx-auto hidden">
        <header class="text-center mb-10 pb-5 border-b-2 border-teal-500">
            <h1 class="text-4xl font-bold text-teal-700">نِرمل لائبريري ڪتابن جو انتظاميا پينل</h1>
            <p class="mt-2 text-gray-600">ڪتاب شامل ڪريو ۽ فهرست کي منظم ڪريو.</p>
        </header>

        <!-- Add Book Form -->
        <div class="bg-white p-6 rounded-lg shadow-xl max-w-2xl mx-auto mb-10 border-t-4 border-amber-500">
            <h2 class="text-2xl font-bold mb-4 text-center">نئون ڪتاب شامل ڪريو</h2>
            <div class="mb-4">
                <label for="book-title" class="block text-right mb-2 font-medium">ڪتاب جو نالو</label>
                <input type="text" id="book-title" class="w-full p-2 border border-gray-300 rounded-md" placeholder="مثال: انگريزي گرامر جا بنيادي اصول">
            </div>
            <div class="mb-6">
                <label for="book-category" class="block text-right mb-2 font-medium">ڪيٽيگري</label>
                <input type="text" id="book-category" class="w-full p-2 border border-gray-300 rounded-md" placeholder="مثال: تعليم، تاريخ، ناول، سائنس">
            </div>
            
            <div id="status" class="text-center mb-4 font-semibold text-sm"></div>

            <button onclick="window.submitBook()" class="w-full bg-teal-600 text-white font-bold py-3 rounded-md hover:bg-teal-700 transition-colors">ڪتاب شامل ڪريو</button>
        </div>

        <!-- Book List Table -->
        <h2 class="text-3xl font-bold text-center mb-6 text-teal-700">موجوده ڪتابن جي فهرست</h2>
        <div class="overflow-x-auto bg-white rounded-lg shadow-xl">
            <table class="min-w-full divide-y divide-gray-200">
                <thead>
                    <tr>
                        <th class="p-4 bg-teal-50 text-right text-xs font-medium text-gray-500 uppercase tracking-wider">شمار</th>
                        <th class="p-4 bg-teal-50 text-right text-xs font-medium text-gray-500 uppercase tracking-wider">ڪتاب جو نالو</th>
                        <th class="p-4 bg-teal-50 text-right text-xs font-medium text-gray-500 uppercase tracking-wider">ڪيٽيگري</th>
                        <th class="p-4 bg-teal-50 text-right text-xs font-medium text-gray-500 uppercase tracking-wider">شامل ٿيڻ جي تاريخ</th>
                        <th class="p-4 bg-teal-50 text-right text-xs font-medium text-gray-500 uppercase tracking-wider">عمل</th>
                    </tr>
                </thead>
                <tbody id="book-list" class="bg-white divide-y divide-gray-200">
                    <tr><td colspan="5" class="p-4 text-center text-gray-500">لوڊ ٿي رهيو آهي...</td></tr>
                </tbody>
            </table>
        </div>
    </div>
</body>
</html>
