<!DOCTYPE html>
<html lang="sd" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ميمبرشپ اسٽيٽس ٽريڪر</title>
    <!-- NEW: Favicon (Updated URL) -->
    <link rel="icon" href="https://raw.githubusercontent.com/waqasmangi/Nirmal-Library/37112ca6d5127e34450b8e6ad5041962e5240167/1000359794-removebg-preview.png" type="image/png">
    
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
    
    <style>
        /* Custom Font */
        @font-face {
            font-family: 'MBLateefi';
            src: url('MB Lateefi.otf') format('opentype');
            font-weight: normal;
            font-style: normal;
        }
        body {
            font-family: 'MBLateefi', 'Noto Nastaliq Urdu', serif;
        }
        .latin {
            font-family: Inter, sans-serif;
            direction: ltr; 
        }
        .text-right-aligned {
             text-align: right;
        }
        /* Consolidated Logo Style - FIX APPLIED (Used for the card) */
        .card-header-logo {
            width: 30px;
            height: 30px;
            object-fit: contain; 
            margin-left: 5px; 
            background-color: #fcd34d; 
            border-radius: 9999px;
            padding: 1px;
        }
        /* Card Styles */
        .card-container {
            width: 350px; 
            height: 250px; 
            margin: 20px auto;
            border: 3px solid #115e59;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 10px 15px rgba(0, 0, 0, 0.2);
            background-color: white;
            display: flex;
            flex-direction: column;
            position: relative; 
        }
        .card-header {
            background-color: #0d9488;
            color: white;
            padding: 4px 8px;
            text-align: center;
            line-height: 1.1;
            display: flex; 
            align-items: center; 
            justify-content: center; 
        }
        .card-body {
            display: flex; 
            background-color: #f0fdf4;
            padding: 8px 5px 35px 5px; 
            flex-grow: 1;
            align-items: flex-start;
        }
        .card-photo-section {
            width: 100px; 
            display: flex;
            flex-direction: column;
            align-items: center;
            padding-top: 5px;
            text-align: center;
            flex-shrink: 0;
        }
        .card-photo {
            width: 80px;
            height: 95px;
            border-radius: 4px;
            object-fit: cover;
            border: 2px solid #fbbf24;
        }
        .card-id-display {
            font-size: 11px;
            font-weight: 800;
            color: #b91c1c; 
            margin-top: 3px;
            letter-spacing: 0.5px;
        }
        .card-details-wrapper {
            flex-grow: 1;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding-right: 5px;
            font-size: 10px;
        }
        .card-details-grid {
            display: grid;
            grid-template-columns: max-content 1fr; 
            gap: 1px 4px; 
            line-height: 1.3;
        }
        .detail-label {
            font-weight: 600;
            color: #115e59; 
            text-align: right;
            white-space: nowrap;
        }
        .detail-value {
            font-weight: 700;
            color: #374151; 
            text-align: right;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }
        .signature-row {
            display: flex;
            justify-content: space-between;
            width: 100%;
            margin-top: 10px;
            font-size: 8px;
            line-height: 1.1;
        }
        .signature-box {
            text-align: center;
            width: 48%; 
        }
        .signature-line {
            border-top: 1px dashed #4b5563;
            width: 100%;
            margin-top: 20px; 
            margin-bottom: 1px;
        }
        .card-footer {
             background-color: #115e59; 
             color: #a7f3d0; 
             font-size: 10px; 
             text-align: center;
             padding: 3px 4px; 
             position: absolute; 
             bottom: 0;
             width: 100%;
        }
        /* NEW: WhatsApp Button Style */
        .whatsapp-button {
            background-color: #25d366;
            color: white;
            font-weight: bold;
            padding: 12px 32px;
            border-radius: 9999px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
            transition: background-color 0.3s;
            display: inline-flex;
            align-items: center;
            justify-content: center;
        }
        .whatsapp-button:hover {
            background-color: #1ebe58;
        }
        @media print {
            body * { visibility: hidden; }
            #card-area, #card-area * { visibility: visible; }
            #card-area {
                position: absolute;
                left: 0;
                top: 0;
                margin: 0;
            }
            .no-print { display: none; }
        }
    </style>

    <!-- Firebase SDK Imports -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getAuth, signInAnonymously } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
        import { getFirestore, collection, query, where, getDocs, setLogLevel } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";
        
        setLogLevel('Debug');
        
        // --- Shared Firebase Config ---
        const firebaseConfig = {
            apiKey: "AIzaSyBxgOhd3y5L7Xl_IzWkuJ02PBlswR9lt5k",
            authDomain: "nirmal-library.firebaseapp.com",
            projectId: "nirmal-library", 
            storageBucket: "nirmal-library.firebasestorage.app",
            messagingSenderId: "157338670869",
            appId: "1:157338670869:web:f44c9b0a3d9e9ebedcfb1c"
        };
        const appId = firebaseConfig.projectId;
        // --- End Shared Firebase Config ---

        let db;
        let auth;
        let currentMemberData = null; 
        
        const formatDate = (dateValue) => {
            if (!dateValue) return 'نامعلوم';
            const date = dateValue.toDate ? dateValue.toDate() : new Date(dateValue);
            return date.toLocaleDateString('sd-PK', { year: 'numeric', month: '2-digit', day: '2-digit' });
        };
        
        async function initFirebaseAndAuth() {
            try {
                const app = initializeApp(firebaseConfig);
                db = getFirestore(app);
                auth = getAuth(app);
                await signInAnonymously(auth);
                const urlParams = new URLSearchParams(window.location.search);
                const idFromUrl = urlParams.get('id');
                if (idFromUrl) {
                    document.getElementById('card-id-input').value = idFromUrl;
                    window.checkStatus();
                }
            } catch (error) {
                const statusElement = document.getElementById('status-message');
                if (statusElement) statusElement.textContent = `ڊيٽابيس لوڊ ڪرڻ ۾ غلطي. (${error.code})`;
                if (statusElement) statusElement.className = 'text-center mb-4 font-semibold text-sm text-red-600';
                console.error("Firebase Auth Error:", error);
            }
        }
        
        window.checkStatus = async function() {
            const cardId = document.getElementById('card-id-input').value.trim().toUpperCase();
            const statusElement = document.getElementById('status-message');
            const resultArea = document.getElementById('result-area');
            const cardArea = document.getElementById('card-area');
            const printButton = document.getElementById('print-card-button');
            const shareButton = document.getElementById('share-card-button'); // NEW

            if (statusElement) {
                 statusElement.textContent = '';
                 statusElement.className = 'text-center mb-4 font-semibold text-sm text-gray-600';
            }
            if (resultArea) resultArea.classList.add('hidden');
            if (cardArea) cardArea.innerHTML = '';
            if (printButton) printButton.classList.add('hidden');
            if (shareButton) shareButton.classList.add('hidden'); // NEW
            
            currentMemberData = null;

            if (!cardId) {
                if (statusElement) statusElement.textContent = 'مھرباني ڪري ميمبرشپ ID داخل ڪريو.';
                return;
            }

            if (statusElement) statusElement.textContent = 'اسٽيٽس ڳولي رهيو آهي...';
            
            try {
                const membersRef = collection(db, `artifacts/${appId}/public/data/members`);
                const q = query(membersRef, where('cardId', '==', cardId));
                const querySnapshot = await getDocs(q);
                
                if (querySnapshot.empty) {
                    if (statusElement) statusElement.textContent = 'ڪابه درخواست يا ميمبرشپ ID نه ملي.';
                    return;
                }
                
                const data = querySnapshot.docs[0].data();
                currentMemberData = data;
                
                if (resultArea) resultArea.classList.remove('hidden');

                if (data.status === 'Pending') {
                    if (statusElement) statusElement.innerHTML = `<span class="text-amber-600 font-bold">توهان جي درخواست جائزي هيٺ آهي. مهرباني ڪري صبر ڪيو.</span>`;
                
                } else if (data.status === 'Cancelled' || data.status === 'Rejected') {
                    const reason = data.cancellationReason || 'سبب نامعلوم آهي. وڌيڪ معلومات لاءِ لائبريرين سان رابطو ڪريو.';
                    if (statusElement) statusElement.innerHTML = `
                        <span class="text-red-600 font-bold">توهان جي ميمبرشپ درخواست رد ڪئي وئي آهي.</span><br>
                        <span class="text-gray-700 text-sm mt-1 block">سبب: ${reason}</span>
                    `;

                } else if (data.status === 'Approved') {
                    if (statusElement) statusElement.innerHTML = `<span class="text-green-600 font-bold">توهان جي ميمبرشپ منظور ٿي چڪي آهي! هيٺ ڏنل ڪارڊ پرنٽ ڪريو.</span>`;
                    if (printButton) printButton.classList.remove('hidden');
                    if (shareButton) shareButton.classList.remove('hidden'); // NEW
                    window.renderCard(data); 
                }

            } catch (error) {
                console.error("Error fetching data:", error);
                if (statusElement) statusElement.textContent = `ڊيٽابيس مان ڊيٽا حاصل ڪرڻ ۾ غلطي ٿي. (${error.message})`;
            }
        };

        window.renderCard = function(data) {
            const cardArea = document.getElementById('card-area');
            if (!cardArea) return;
            
            const approvedDateStr = formatDate(data.approvedDate);
            const expiryDateStr = formatDate(data.expiryDate);
            const dobStr = formatDate(data.dob);

            cardArea.innerHTML = `
                <div class="card-container" id="membership-card-to-print">
                    
                    <!-- Card Header (UPDATED: Raw URL) -->
                    <div class="card-header">
                         <img src="https://raw.githubusercontent.com/waqasmangi/Nirmal-Library/37112ca6d5127e34450b8e6ad5041962e5240167/1000359794-removebg-preview.png" 
                            alt="Nirmal Logo" 
                            class="card-header-logo">
                        <div>
                            <h2 class="text-lg font-extrabold leading-none">نِرمل جيوتاڻي لائبريري ٿرڙي محبت</h2>
                            <p class="text-sm">ميمبرشپ ڪارڊ</p>
                        </div>
                    </div>
                    
                    <!-- Card Body -->
                    <div class="card-body">
                        
                        <div class="card-details-wrapper">
                            <div class="card-details-section">
                                <h3 class="text-sm font-bold text-teal-800 mb-1">شاگرد جي تفصيل</h3>
                                <div class="card-details-grid">
                                    <div class="detail-label">نالو</div>
                                    <div class="detail-value text-teal-800 font-extrabold">${data.name}</div>
                                    <div class="detail-label">پيءُ جو نالو</div>
                                    <div class="detail-value">${data.fatherName}</div>
                                    <div class="detail-label">پيشو</div>
                                    <div class="detail-value">${data.occupation}</div>
                                    <div class="detail-label">پيدائش جي تاريخ</div>
                                    <div class="detail-value latin">${dobStr}</div>
                                    <div class="detail-label">جاري ٿيڻ جي تاريخ</div>
                                    <div class="detail-value latin">${approvedDateStr}</div>
                                    <div class="detail-label text-red-600">مدت ختم</div>
                                    <div class="detail-value latin text-red-600 font-extrabold">${expiryDateStr}</div>
                                </div>
                            </div>
                            
                            <div class="signature-row">
                                <div class="signature-box">
                                    <div class="signature-line mr-auto"></div>
                                    <p>لائبريرين جا دستخط</p>
                                    <p class="latin text-gray-700">(Issuer/Librarian)</p>
                                </div>
                                <div class="signature-box">
                                    <div class="signature-line ml-auto"></div>
                                    <p>شاگرد جا دستخط</p>
                                    <p class="latin text-gray-700">(Student Signature)</p>
                                </div>
                            </div>
                        </div>

                        <div class="card-photo-section">
                            <img src="${data.photoBase64}" class="card-photo" alt="${data.name} Photo">
                            <p class="card-id-display latin">${data.cardId}</p>
                            <p class="text-[8px] text-gray-500 mt-0.5">ميمبرشپ ID نمبر</p>
                        </div>

                    </div>
                    
                    <div class="card-footer">
                        آزاد منگي فائونڊيشن جي طرفان
                    </div>
                </div>
            `;
        };

        window.printCard = function() {
            const cardElement = document.getElementById('membership-card-to-print');
            if (!cardElement) {
                document.getElementById('status-message').textContent = 'ڪارڊ پرنٽ ڪرڻ لاءِ دستياب ناهي.';
                return;
            }
            
            // Fix 1: Add useCORS to html2canvas for better external image loading
            const opt = {
                margin: 5,
                filename: `Nirmal_Jevtani_Library_Card_${currentMemberData.cardId}.pdf`,
                image: { type: 'jpeg', quality: 0.98 },
                html2canvas: { 
                    scale: 3,
                    useCORS: true // This helps load the external logo image correctly
                },
                jsPDF: { unit: 'mm', format: 'a4', orientation: 'landscape' },
                pagebreak: { mode: 'avoid-all' }
            };

            html2pdf().from(cardElement).set(opt).save();
        };
        
        // NEW Function for Sharing as Image
        window.shareCardAsImage = function() {
            const cardElement = document.getElementById('membership-card-to-print');
            const statusElement = document.getElementById('status-message');
            const shareButton = document.getElementById('share-card-button');

            if (!cardElement) {
                statusElement.textContent = 'ڪارڊ شيئر ڪرڻ لاءِ دستياب ناهي.';
                return;
            }
            
            statusElement.innerHTML = `<span class="text-amber-600 font-bold">تصوير تيار ڪري رهيو آهي... مھرباني ڪري انتظار ڪريو.</span>`;
            shareButton.disabled = true;

            // Use html2canvas part of the bundle to convert the card to a canvas
            const html2canvas = window.html2pdf.require('html2canvas');
            
            html2canvas(cardElement, {
                scale: 3, 
                useCORS: true 
            }).then(canvas => {
                // Convert canvas to data URL (PNG)
                const imageData = canvas.toDataURL('image/png');
                
                // Create a temporary link element to trigger download
                const a = document.createElement('a');
                a.href = imageData;
                a.download = `Nirmal_Library_Card_${currentMemberData.cardId}.png`;
                
                // Append to body, click, and remove
                document.body.appendChild(a);
                a.click();
                document.body.removeChild(a);

                statusElement.innerHTML = `<span class="text-green-600 font-bold">تصوير ڊائونلوڊ ٿي وئي!</span> مھرباني ڪري ڊائونلوڊ ڪيل PNG فائل WhatsApp تي شيئر ڪريو.`;
                shareButton.disabled = false;
                
                // Provide a direct WhatsApp link for text/URL sharing as a fallback/alternative
                const cardLink = window.location.href.split('?')[0]; 
                const shareText = encodeURIComponent(`منهنجو نرمل لائبريري ميمبرشپ ڪارڊ ${currentMemberData.cardId} لاءِ! 📚 تصوير ڊائونلوڊ ڪري شيئر ڪريو. وڌيڪ ڄاڻ لاءِ: ${cardLink}`);
                
                setTimeout(() => {
                    statusElement.innerHTML += `<br><span class="text-blue-600 text-sm mt-1 block">يا هي پيغام سڌو WhatsApp تي شيئر ڪريو:</span> 
                                                <a href="whatsapp://send?text=${shareText}" target="_blank" class="text-blue-600 underline">WhatsApp تي لنڪ شيئر ڪريو</a>`;
                }, 1500);

            }).catch(error => {
                console.error("Error converting card to image:", error);
                statusElement.textContent = `تصوير ٺاهڻ ۾ غلطي ٿي. (${error.message})`;
                shareButton.disabled = false;
            });
        };


        document.addEventListener('DOMContentLoaded', initFirebaseAndAuth);
    </script>
</head>
<body class="bg-stone-50 text-gray-800 p-4 md:p-8">

    <div class="container mx-auto max-w-2xl">
        <header class="text-center mb-8 pb-4 border-b-2 border-teal-500 no-print">
            <a href="index.html" class="text-sm text-blue-600 hover:text-blue-800 transition-colors flex items-center justify-start mb-4">← مکيه پورٽل ڏانهن واپس</a>
            <h1 class="text-3xl font-bold text-teal-700">ميمبرشپ اسٽيٽس چيڪر</h1>
            <p class="mt-1 text-gray-600">پنھنجو ID داخل ڪريو ته جيئن درخواست جي حيثيت معلوم ڪري سگھجي.</p>
        </header>

        <!-- Status Check Form -->
        <div class="bg-white p-6 rounded-lg shadow-xl border-t-4 border-amber-500 mb-8 no-print">
            <label for="card-id-input" class="block text-right mb-2 font-medium">پنهنجو منفرد ميمبرشپ ID نمبر داخل ڪريو</label>
            <div class="flex space-x-2 space-x-reverse">
                <button onclick="window.checkStatus()" class="bg-teal-600 text-white font-bold py-3 px-6 rounded-md hover:bg-teal-700 transition-colors whitespace-nowrap">چيڪ اسٽيٽس</button>
                <input type="text" id="card-id-input" class="w-full p-3 border border-gray-300 rounded-md text-right-aligned latin" placeholder="مثال: NJL-F4A5B6C7">
            </div>
            
            <div id="status-message" class="text-center mt-4 font-semibold text-sm text-gray-600"></div>
        </div>

        <!-- Result Area -->
        <div id="result-area" class="hidden text-center">
            
            <div id="card-area">
                <!-- Membership Card will be rendered here -->
            </div>
            
            <!-- Updated Buttons Container -->
            <div class="mt-6 flex flex-col sm:flex-row justify-center space-y-4 sm:space-y-0 sm:space-x-4 sm:space-x-reverse no-print">
                <button id="print-card-button" onclick="window.printCard()" class="hidden bg-amber-600 text-white font-bold py-3 px-8 rounded-full shadow-lg hover:bg-amber-700 transition-colors">
                    <span class="mr-2">ڊائونلوڊ / پرنٽ ڪارڊ (PDF)</span>
                    <span class="latin">🖨️</span>
                </button>
                
                <!-- NEW: WhatsApp Share Button -->
                <button id="share-card-button" onclick="window.shareCardAsImage()" class="hidden whatsapp-button">
                    <svg class="w-6 h-6 ml-2" viewBox="0 0 24 24" fill="currentColor" xmlns="http://www.w3.org/2000/svg">
                        <path d="M12.0003 2C6.48028 2 2 6.48028 2 12C2 14.195 2.72 16.205 3.96 17.84L2.09038 22.0996L6.50028 21.0196C8.075 22.0496 9.94028 22.56 12.0003 22.56C17.5203 22.56 22.0003 18.08 22.0003 12.56C22.0003 7.04028 17.5203 2.56028 12.0003 2.56028V2ZM17.1503 16.29C16.8903 16.71 14.8503 17.75 14.4903 17.89C14.1303 18.03 13.7703 18.15 13.4103 17.97C13.0503 17.79 11.8503 17.37 10.1103 15.81C8.75028 14.61 7.85028 13.11 7.59028 12.69C7.33028 12.27 8.01028 11.97 8.19028 11.79C8.34028 11.64 8.52028 11.4 8.70028 11.16C8.88028 10.92 8.94028 10.8 9.06028 10.56C9.18028 10.32 9.12028 10.2 9.06028 10.08C8.97028 9.87 8.35028 8.31 8.08028 7.77C7.81028 7.23 7.55028 7.35 7.37028 7.35C7.19028 7.35 6.95028 7.35 6.71028 7.35C6.47028 7.35 6.11028 7.44 5.75028 7.8C5.39028 8.16 4.79028 8.7 4.79028 9.84C4.79028 10.98 5.66028 12.18 5.79028 12.36C5.92028 12.54 7.45028 14.85 9.77028 16.89C11.6703 18.39 13.2303 18.99 13.7403 19.14C14.2503 19.29 15.0603 19.23 15.6303 18.9C16.2003 18.57 16.8603 18.06 17.0703 17.7C17.2803 17.34 17.3703 17.16 17.1503 16.29Z"/>
                    </svg>
                    WhatsApp تي شيئر ڪريو
                </button>
            </div>
        </div>
        
    </div>
</body>
</html>
