<!DOCTYPE html>
<html lang="sd" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ممبرشپ اسٽيٽس ٽريڪر</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
    
    <!-- Custom Font: MB Lateefi.otf -->
    <style>
        @font-face {
            font-family: 'MBLateefi';
            src: url('MB Lateefi.otf') format('opentype');
            font-weight: normal;
            font-style: normal;
        }
        body {
            font-family: 'MBLateefi', 'Noto Nastaliq Urdu', serif;
        }
        .latin {
            font-family: Inter, sans-serif;
            direction: ltr; 
        }
        .text-right-aligned {
             text-align: right;
        }
        .card-container {
            width: 320px;
            height: 200px;
            margin: 20px auto;
            border: 1px solid #047857; /* Teal-700 */
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 10px 15px rgba(0, 0, 0, 0.1);
        }
        .card-header {
            background-color: #0d9488; /* Teal-600 */
            color: white;
            padding: 8px;
            text-align: center;
        }
        .card-body {
            background-color: #e0f2f1; /* Teal-50 */
            padding: 10px;
            display: flex;
            flex-direction: row-reverse;
            justify-content: space-between;
            height: 140px;
            position: relative; /* For signature positioning */
        }
        .card-photo {
            width: 80px;
            height: 80px;
            border-radius: 4px;
            object-fit: cover;
            border: 2px solid #fbbf24; /* Amber-400 */
            margin-top: 5px;
            z-index: 10;
        }
        .card-details {
            text-align: right;
            line-height: 1.2;
            font-size: 11px;
            width: calc(100% - 90px);
            z-index: 10;
        }
        .card-footer {
             background-color: #115e59; /* Teal-700 */
             color: #fcd34d; /* Amber-300 */
             font-size: 10px;
             text-align: center;
             padding: 4px;
        }
        
        /* Signature Area Styling (NEW) */
        .signature-area {
            position: absolute;
            bottom: 10px;
            left: 10px;
            right: 10px;
            display: flex;
            justify-content: space-between;
            width: 95%;
            font-size: 8px;
            z-index: 5;
        }
        .signature-line {
            border-top: 1px dashed #4b5563; /* Gray-600 */
            width: 70px;
            margin-top: 2px;
            margin-bottom: 2px;
        }
        .sig-box {
            text-align: center;
            line-height: 1.1;
        }

        /* Styling for PDF Print Button */
        @media print {
            body * { visibility: hidden; }
            #card-area, #card-area * { visibility: visible; }
            #card-area {
                position: absolute;
                left: 0;
                top: 0;
                margin: 0;
            }
            .no-print { display: none; }
        }
        
    </style>

    <!-- Firebase SDK Imports -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getAuth, signInAnonymously } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
        import { getFirestore, collection, query, where, getDocs, setLogLevel } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";
        
        setLogLevel('Debug');
        
        // --- Shared Firebase Config ---
        const firebaseConfig = {
            apiKey: "AIzaSyBxgOhd3y5L7Xl_IzWkuJ02PBlswR9lt5k",
            authDomain: "nirmal-library.firebaseapp.com",
            projectId: "nirmal-library", 
            storageBucket: "nirmal-library.firebasestorage.app",
            messagingSenderId: "157338670869",
            appId: "1:157338670869:web:f44c9b0a3d9e9ebedcfb1c"
        };
        const appId = firebaseConfig.projectId;
        // --- End Shared Firebase Config ---

        let db;
        let auth;
        let currentMemberData = null; // Store fetched data here
        
        // Helper function to format date
        const formatDate = (dateValue) => {
            if (!dateValue) return 'نامعلوم';
            const date = dateValue.toDate ? dateValue.toDate() : new Date(dateValue);
            return date.toLocaleDateString('sd-PK', { year: 'numeric', month: '2-digit', day: '2-digit' });
        };
        
        // --- Firebase Initialization and Auth ---
        async function initFirebaseAndAuth() {
            try {
                const app = initializeApp(firebaseConfig);
                db = getFirestore(app);
                auth = getAuth(app);
                await signInAnonymously(auth);
                // Check for ID in URL if coming from the apply page
                const urlParams = new URLSearchParams(window.location.search);
                const idFromUrl = urlParams.get('id');
                if (idFromUrl) {
                    document.getElementById('card-id-input').value = idFromUrl;
                    window.checkStatus();
                }
            } catch (error) {
                const statusElement = document.getElementById('status-message');
                if (statusElement) statusElement.textContent = `ڊيٽابيس لوڊ ڪرڻ ۾ غلطي. (${error.code})`;
                if (statusElement) statusElement.className = 'text-center mb-4 font-semibold text-sm text-red-600';
                console.error("Firebase Auth Error:", error);
            }
        }
        
        // --- Status Check Logic ---
        window.checkStatus = async function() {
            const cardId = document.getElementById('card-id-input').value.trim().toUpperCase();
            const statusElement = document.getElementById('status-message');
            const resultArea = document.getElementById('result-area');
            const cardArea = document.getElementById('card-area');
            const printButton = document.getElementById('print-card-button');
            
            if (statusElement) {
                 statusElement.textContent = '';
                 statusElement.className = 'text-center mb-4 font-semibold text-sm text-gray-600';
            }
            if (resultArea) resultArea.classList.add('hidden');
            if (cardArea) cardArea.innerHTML = '';
            if (printButton) printButton.classList.add('hidden');
            
            currentMemberData = null;

            if (!cardId) {
                if (statusElement) statusElement.textContent = 'مھرباني ڪري ممبرشپ ID داخل ڪريو.';
                return;
            }

            if (statusElement) statusElement.textContent = 'اسٽيٽس ڳولي رهيو آهي...';
            
            try {
                const membersRef = collection(db, `artifacts/${appId}/public/data/members`);
                const q = query(membersRef, where('cardId', '==', cardId));
                
                const querySnapshot = await getDocs(q);
                
                if (querySnapshot.empty) {
                    if (statusElement) statusElement.textContent = 'ڪابه درخواست يا ممبرشپ ID نه ملي.';
                    return;
                }
                
                // Assuming cardId is unique, there should be only one result
                const memberDoc = querySnapshot.docs[0];
                const data = memberDoc.data();
                currentMemberData = data; // Store data globally
                
                if (resultArea) resultArea.classList.remove('hidden');

                if (data.status === 'Pending') {
                    if (statusElement) statusElement.innerHTML = `<span class="text-amber-600">توهان جي درخواست جائزي هيٺ آهي. مهرباني ڪري صبر ڪيو.</span>`;
                
                } else if (data.status === 'Rejected') {
                    if (statusElement) statusElement.innerHTML = `<span class="text-red-600">توهان جي ممبرشپ درخواست رد ڪئي وئي آهي. وڌيڪ معلومات لاءِ لائبريرين سان رابطو ڪريو.</span>`;

                } else if (data.status === 'Approved') {
                    if (statusElement) statusElement.innerHTML = `<span class="text-green-600 font-bold">توهان جي ممبرشپ منظور ٿي چڪي آهي! هيٺ ڏنل ڪارڊ پرنٽ ڪريو.</span>`;
                    if (printButton) printButton.classList.remove('hidden');
                    window.renderCard(data); // Render the card immediately
                }

            } catch (error) {
                console.error("Error fetching data:", error);
                if (statusElement) statusElement.textContent = `ڊيٽابيس مان ڊيٽا حاصل ڪرڻ ۾ غلطي ٿي. (${error.message})`;
            }
        };

        // --- Card Rendering Logic (UPDATED) ---
        window.renderCard = function(data) {
            const cardArea = document.getElementById('card-area');
            if (!cardArea) return;
            
            const approvedDateStr = formatDate(data.approvedDate);
            const expiryDateStr = formatDate(data.expiryDate);

            cardArea.innerHTML = `
                <div class="card-container border-4 border-teal-800" id="membership-card-to-print">
                    <div class="card-header">
                        <h2 class="text-lg font-extrabold leading-none">نرمل جيوتاڻي لائبريري</h2>
                        <p class="text-xs">ممبرشپ ڪارڊ</p>
                    </div>
                    <div class="card-body">
                        <div class="card-details">
                            <p class="font-bold text-teal-800 text-lg">${data.name}</p>
                            <p class="text-gray-700">پيءُ جو نالو: ${data.fatherName}</p>
                            <p class="text-gray-700">پيشو: ${data.occupation}</p>
                            <p class="text-gray-700">موبايل: <span class="latin">${data.contact}</span></p>
                            <p class="mt-2 text-teal-700 font-bold">ID #: <span class="latin">${data.cardId}</span></p>
                            <p class="mt-1 text-xs">منظوري: <span class="latin">${approvedDateStr}</span></p>
                            <p class="text-xs text-red-600">مدت ختم ٿيڻ: <span class="latin">${expiryDateStr}</span></p>
                        </div>
                        <img src="${data.photoBase64}" class="card-photo" alt="${data.name} Photo">
                        
                        <!-- Signature Area (NEW) -->
                        <div class="signature-area">
                            <div class="sig-box text-right">
                                <div class="signature-line"></div>
                                <p>لائبريرين جا دستخط</p>
                                <p class="latin text-xs">(Issuer/Librarian)</p>
                            </div>
                            <div class="sig-box text-left">
                                <div class="signature-line"></div>
                                <p>شاگرد جا دستخط</p>
                                <p class="latin text-xs">(Student Signature)</p>
                            </div>
                        </div>
                        
                    </div>
                    <div class="card-footer">
                        نِرمل جيوتاڻي لائبريري ٿرڙي محبت، آزاد منگي فائونڊيشن جي طرفان
                    </div>
                </div>
            `;
        };

        // --- PDF Generation Logic (using html2pdf) ---
        window.printCard = function() {
            const cardElement = document.getElementById('membership-card-to-print');
            if (!cardElement) {
                document.getElementById('status-message').textContent = 'ڪارڊ پرنٽ ڪرڻ لاءِ دستياب ناهي.';
                return;
            }

            const cardClone = cardElement.cloneNode(true);
            
            const opt = {
                margin: 5,
                filename: `Nirmal_Jevtani_Library_Card_${currentMemberData.cardId}.pdf`,
                image: { type: 'jpeg', quality: 0.98 },
                html2canvas: { scale: 3 },
                jsPDF: { unit: 'mm', format: 'a7', orientation: 'landscape' } // A7 size is good for cards
            };

            html2pdf().from(cardClone).set(opt).save();
        };


        document.addEventListener('DOMContentLoaded', initFirebaseAndAuth);
    </script>
</head>
<body class="bg-stone-50 text-gray-800 p-4 md:p-8">

    <div class="container mx-auto max-w-2xl">
        <header class="text-center mb-8 pb-4 border-b-2 border-teal-500 no-print">
            <a href="index.html" class="text-sm text-blue-600 hover:text-blue-800 transition-colors flex items-center justify-start mb-4">← مکيه پورٽل ڏانهن واپس</a>
            <h1 class="text-3xl font-bold text-teal-700">ممبرشپ اسٽيٽس چيڪر</h1>
            <p class="mt-1 text-gray-600">پنھنجو ID داخل ڪريو ته جيئن درخواست جي حيثيت معلوم ڪري سگھجي.</p>
        </header>

        <!-- Status Check Form -->
        <div class="bg-white p-6 rounded-lg shadow-xl border-t-4 border-amber-500 mb-8 no-print">
            <label for="card-id-input" class="block text-right mb-2 font-medium">پنهنجو منفرد ممبرشپ ID نمبر داخل ڪريو</label>
            <div class="flex space-x-2 space-x-reverse">
                <button onclick="window.checkStatus()" class="bg-teal-600 text-white font-bold py-3 px-6 rounded-md hover:bg-teal-700 transition-colors whitespace-nowrap">چيڪ اسٽيٽس</button>
                <input type="text" id="card-id-input" class="w-full p-3 border border-gray-300 rounded-md text-right-aligned latin" placeholder="مثال: NJL-F4A5B6C7">
            </div>
            
            <div id="status-message" class="text-center mt-4 font-semibold text-sm text-gray-600"></div>
        </div>

        <!-- Result Area (Hidden until status is Approved) -->
        <div id="result-area" class="hidden text-center">
            
            <!-- Card Display Area -->
            <div id="card-area">
                <!-- Membership Card will be rendered here by renderCard(data) -->
            </div>
            
            <!-- Print Button (Visible only if Approved) -->
            <button id="print-card-button" onclick="window.printCard()" class="hidden mt-6 bg-amber-600 text-white font-bold py-3 px-8 rounded-full shadow-lg hover:bg-amber-700 transition-colors no-print">
                <span class="mr-2">ڊائونلوڊ / پرنٽ ڪارڊ (PDF)</span>
                <span class="latin">🖨️</span>
            </button>
        </div>
        
    </div>
</body>
</html>
