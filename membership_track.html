<!DOCTYPE html>
<html lang="sd" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title id="page-title">ميمبرشپ اسٽيٽس ٽريڪر</title>
    <!-- NEW: Favicon (Updated URL) -->
    <link rel="icon" href="https://raw.githubusercontent.com/waqasmangi/Nirmal-Library/37112ca6d5127e34450b8e6ad5041962e5240167/1000359794-removebg-preview.png" type="image/png">
    
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
    
    <style>
        /* Custom Font */
        @font-face {
            font-family: 'MBLateefi';
            src: url('MB Lateefi.otf') format('opentype');
            font-weight: normal;
            font-style: normal;
        }
        body {
            font-family: 'MBLateefi', 'Noto Nastaliq Urdu', serif;
        }
        .latin {
            font-family: Inter, sans-serif;
            direction: ltr; 
        }
        .text-right-aligned {
             text-align: right;
        }
        /* Consolidated Logo Style */
        .nirmal-logo-header {
            width: 55px;
            height: 55px; 
            object-fit: contain; 
            border-radius: 9999px; 
            background-color: #fcd34d;
            padding: 2px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
            margin-left: 1rem;
        }
        
        /* Card Styles */
        .card-container {
            width: 350px; 
            height: 250px; 
            margin: 20px auto;
            border: 3px solid #115e59;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 10px 15px rgba(0, 0, 0, 0.2);
            background-color: white;
            display: flex;
            flex-direction: column;
            position: relative; 
        }
        .card-header {
            background-color: #0d9488;
            color: white;
            padding: 4px 8px;
            text-align: center;
            line-height: 1.1;
            display: flex; 
            align-items: center; 
            justify-content: center; 
        }
        .card-header-logo {
            width: 30px;
            height: 30px;
            object-fit: contain; 
            margin-left: 5px; 
            background-color: #fcd34d; 
            border-radius: 9999px;
            padding: 1px;
        }
        .card-body {
            display: flex; 
            background-color: #f0fdf4;
            padding: 8px 5px 35px 5px; 
            flex-grow: 1;
            align-items: flex-start;
        }
        .card-photo-section {
            width: 100px; 
            display: flex;
            flex-direction: column;
            align-items: center;
            padding-top: 5px;
            text-align: center;
            flex-shrink: 0;
        }
        .card-photo {
            width: 80px;
            height: 95px;
            border-radius: 4px;
            object-fit: cover;
            border: 2px solid #fbbf24;
        }
        .card-id-display {
            font-size: 11px;
            font-weight: 800;
            color: #b91c1c; 
            margin-top: 3px;
            letter-spacing: 0.5px;
        }
        .card-details-wrapper {
            flex-grow: 1;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding-right: 5px;
            font-size: 10px;
        }
        .card-details-grid {
            display: grid;
            grid-template-columns: max-content 1fr; 
            gap: 1px 4px; 
            line-height: 1.3;
        }
        .detail-label {
            font-weight: 600;
            color: #115e59; 
            text-align: right;
            white-space: nowrap;
        }
        .detail-value {
            font-weight: 700;
            color: #374151; 
            text-align: right;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }
        .signature-row {
            display: flex;
            justify-content: space-between;
            width: 100%;
            margin-top: 10px;
            font-size: 8px;
            line-height: 1.1;
        }
        .signature-box {
            text-align: center;
            width: 48%; 
        }
        .signature-line {
            border-top: 1px dashed #4b5563;
            width: 100%;
            margin-top: 20px; 
            margin-bottom: 1px;
        }
        .card-footer {
             background-color: #115e59; 
             color: #a7f3d0; 
             font-size: 10px; 
             text-align: center;
             padding: 3px 4px; 
             position: absolute; 
             bottom: 0;
             width: 100%;
        }
        @media print {
            body * { visibility: hidden; }
            #card-area, #card-area * { visibility: visible; }
            #card-area {
                position: absolute;
                left: 0;
                top: 0;
                margin: 0;
            }
            .no-print { display: none; }
        }
    </style>

    <!-- Firebase SDK Imports -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getAuth, signInAnonymously } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
        import { getFirestore, collection, query, where, getDocs, setLogLevel } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";
        
        setLogLevel('Debug');
        
        // --- Shared Firebase Config ---
        const firebaseConfig = {
            apiKey: "AIzaSyBxgOhd3y5L7Xl_IzWkuJ02PBlswR9lt5k",
            authDomain: "nirmal-library.firebaseapp.com",
            projectId: "nirmal-library", 
            storageBucket: "nirmal-library.firebasestorage.app",
            messagingSenderId: "157338670869",
            appId: "1:157338670869:web:f44c9b0a3d9e9ebedcfb1c"
        };
        const appId = firebaseConfig.projectId;
        // --- End Shared Firebase Config ---

        let db;
        let auth;
        let currentMemberData = null; 
        let currentLang = 'sd';
        
        // --- TRANSLATION DATA ---
        const TRANSLATIONS = {
            sd: {
                title: "ميمبرشپ اسٽيٽس ٽريڪر", subtitle: "پنھنجو ID داخل ڪريو ته جيئن درخواست جي حيثيت معلوم ڪري سگھجي.",
                nav_apply: "درخواست فارم", nav_directory: "ممبرز جي ڊائريڪٽري", nav_inventory: "ڪتابن جي فهرست", 
                nav_feedback: "راءِ", nav_about: "اسان جي باري ۾", nav_admin: "لائبريرين جي رسائي", lang_btn: "English",
                back_to_portal: "← مکيه پورٽل ڏانهن واپس",
                
                // Checker Form
                input_label: "پنهنجو منفرد ميمبرشپ ID نمبر داخل ڪريو", input_placeholder: "مثال: NJL-F4A5B6C7",
                check_status_btn: "چيڪ اسٽيٽس",
                
                // Status Messages
                status_initial: "ميمبرشپ ID داخل ڪريو.",
                status_checking: "اسٽيٽس ڳولي رهيو آهي...",
                status_missing_id: "مھرباني ڪري ميمبرشپ ID داخل ڪريو.",
                status_not_found: "ڪابه درخواست يا ميمبرشپ ID نه ملي.",
                status_pending: "توهان جي درخواست جائزي هيٺ آهي. مهرباني ڪري صبر ڪيو.",
                status_rejected: "توهان جي ميمبرشپ درخواست رد ڪئي وئي آهي.",
                status_reason: "سبب:",
                status_contact: "سبب نامعلوم آهي. وڌيڪ معلومات لاءِ لائبريرين سان رابطو ڪريو.",
                status_approved: "توهان جي ميمبرشپ منظور ٿي چڪي آهي! هيٺ ڏنل ڪارڊ پرنٽ ڪريو.",
                status_fetch_error: "ڊيٽابيس مان ڊيٽا حاصل ڪرڻ ۾ غلطي ٿي.",
                print_btn: "ڊائونلوڊ / پرنٽ ڪارڊ (PDF)",
                print_error: "ڪارڊ پرنٽ ڪرڻ لاءِ دستياب ناهي.",
                
                // Card Details
                card_title: "نِرمل جيوتاڻي لائبريري ٿرڙي محبت", card_subtitle: "ميمبرشپ ڪارڊ",
                card_section_title: "شاگرد جي تفصيل",
                card_name: "نالو", card_father: "پيءُ جو نالو", card_occupation: "پيشو", 
                card_dob: "پيدائش جي تاريخ", card_issue_date: "جاري ٿيڻ جي تاريخ", card_expiry: "مدت ختم",
                card_librarian_sign: "لائبريرين جا دستخط", card_librarian_label: "(Issuer/Librarian)",
                card_student_sign: "شاگرد جا دستخط", card_student_label: "(Student Signature)",
                card_id_label: "ميمبرشپ ID نمبر",
                card_footer: "آزاد منگي فائونڊيشن جي طرفان",
                unknown: "نامعلوم"
            },
            en: {
                title: "Membership Status Tracker", subtitle: "Enter your ID to check the application status.",
                nav_apply: "Apply for Membership", nav_directory: "Members Directory", nav_inventory: "Book Inventory", 
                nav_feedback: "Feedback", nav_about: "About Us", nav_admin: "Librarian Access", lang_btn: "سنڌي",
                back_to_portal: "← Back to Main Portal",
                
                // Checker Form
                input_label: "Enter your unique Membership ID Number", input_placeholder: "Example: NJL-F4A5B6C7",
                check_status_btn: "Check Status",
                
                // Status Messages
                status_initial: "Enter Membership ID.",
                status_checking: "Searching for status...",
                status_missing_id: "Please enter a Membership ID.",
                status_not_found: "No application or Membership ID found.",
                status_pending: "Your application is currently under review. Please be patient.",
                status_rejected: "Your membership application has been rejected.",
                status_reason: "Reason:",
                status_contact: "Reason unknown. Contact the librarian for more information.",
                status_approved: "Your membership has been approved! Print the card below.",
                status_fetch_error: "Error retrieving data from the database.",
                print_btn: "Download / Print Card (PDF)",
                print_error: "Card is not available for printing.",
                
                // Card Details
                card_title: "Nirmal Jewtani Library Tharri Mohabbat", card_subtitle: "Membership Card",
                card_section_title: "Student Details",
                card_name: "Name", card_father: "Father's Name", card_occupation: "Occupation", 
                card_dob: "Date of Birth", card_issue_date: "Issue Date", card_expiry: "Expiry",
                card_librarian_sign: "Librarian's Signature", card_librarian_label: "(Issuer/Librarian)",
                card_student_sign: "Student's Signature", card_student_label: "(Student Signature)",
                card_id_label: "Membership ID Number",
                card_footer: "Presented by Azad Mangi Foundation",
                unknown: "Unknown"
            }
        };

        // --- GLOBAL LANGUAGE TOGGLE FUNCTION (Copied from index.html) ---
        window.toggleLanguage = function() {
            currentLang = (currentLang === 'sd' ? 'en' : 'sd');
            localStorage.setItem('nirmalLang', currentLang);
            updateContent();
        };

        // Helper function for date formatting
        const formatDate = (dateValue) => {
            if (!dateValue) return TRANSLATIONS[currentLang].unknown;
            const date = dateValue.toDate ? dateValue.toDate() : new Date(dateValue);
            return date.toLocaleDateString(currentLang === 'sd' ? 'sd-PK' : 'en-US', { year: 'numeric', month: '2-digit', day: '2-digit' });
        };

        function updateContent() {
            const t = TRANSLATIONS[currentLang];
            document.documentElement.lang = currentLang;
            document.documentElement.dir = (currentLang === 'sd' ? 'rtl' : 'ltr');
            document.querySelectorAll('.text-right-aligned').forEach(el => el.style.textAlign = currentLang === 'sd' ? 'right' : 'left');
            
            // Header/Navigation Updates
            document.getElementById('page-title').textContent = t.title;
            document.getElementById('header-title').textContent = t.title;
            document.getElementById('header-subtitle').textContent = t.subtitle;
            document.getElementById('back-to-portal-link').textContent = t.back_to_portal;
            document.getElementById('nav-apply').textContent = t.nav_apply;
            document.getElementById('nav-directory').textContent = t.nav_directory;
            document.getElementById('nav-inventory').textContent = t.nav_inventory;
            document.getElementById('nav-feedback').textContent = t.nav_feedback;
            document.getElementById('nav-about').textContent = t.nav_about;
            document.getElementById('mobile-nav-apply').textContent = t.nav_apply;
            document.getElementById('mobile-nav-directory').textContent = t.nav_directory;
            document.getElementById('mobile-nav-inventory').textContent = t.nav_inventory;
            document.getElementById('mobile-nav-feedback').textContent = t.nav_feedback;
            document.getElementById('mobile-nav-about').textContent = t.nav_about;
            document.getElementById('mobile-nav-admin').textContent = t.nav_admin;
            document.getElementById('lang-toggle-btn').textContent = t.lang_btn;
            
            // Checker Form Updates
            document.getElementById('input-label').textContent = t.input_label;
            document.getElementById('card-id-input').placeholder = t.input_placeholder;
            document.getElementById('check-status-btn').textContent = t.check_status_btn;
            
            // Update status message dynamically if it's a known state
            const statusElement = document.getElementById('status-message');
            if (statusElement) {
                const currentText = statusElement.textContent;
                
                if (currentText.includes('ميمبرشپ ID داخل ڪريو') || currentText.includes('Enter Membership ID')) {
                     statusElement.textContent = t.status_missing_id;
                } else if (currentText.includes('اسٽيٽس ڳولي رهيو آهي') || currentText.includes('Searching for status')) {
                     statusElement.textContent = t.status_checking;
                } else if (currentText.includes('توهان جي درخواست جائزي هيٺ آهي') || currentText.includes('Your application is currently under review')) {
                     statusElement.innerHTML = `<span class="text-amber-600 font-bold">${t.status_pending}</span>`;
                } else if (currentText.includes('توهان جي ميمبرشپ منظور ٿي چڪي آهي') || currentText.includes('Your membership has been approved')) {
                     statusElement.innerHTML = `<span class="text-green-600 font-bold">${t.status_approved}</span>`;
                } else if (currentText.includes('توهان جي ميمبرشپ درخواست رد ڪئي وئي آهي') || currentText.includes('Your membership application has been rejected')) {
                    // This handles status_rejected which might have a reason appended
                     const reasonMatch = currentText.match(/سبب: (.+)/) || currentText.match(/Reason: (.+)/);
                     let reason = reasonMatch ? reasonMatch[1] : t.status_contact;
                     if (reason.includes('نامعلوم آهي') || reason.includes('unknown')) reason = t.status_contact;
                     
                     statusElement.innerHTML = `
                        <span class="text-red-600 font-bold">${t.status_rejected}</span><br>
                        <span class="text-gray-700 text-sm mt-1 block">${t.status_reason} ${reason}</span>
                    `;
                } else if (currentText === ' ') {
                    statusElement.textContent = t.status_initial;
                }
            }

            // Re-render card if data exists and is approved
            if (currentMemberData && currentMemberData.status === 'Approved') {
                window.renderCard(currentMemberData);
            }

            // Update Print Button
            const printButton = document.getElementById('print-card-button');
            if (printButton) {
                printButton.innerHTML = `<span class="mr-2">${t.print_btn}</span> <span class="latin">🖨️</span>`;
            }

        }
        
        async function initFirebaseAndAuth() {
            try {
                const app = initializeApp(firebaseConfig);
                db = getFirestore(app);
                auth = getAuth(app);
                await signInAnonymously(auth);
                
                currentLang = localStorage.getItem('nirmalLang') || 'sd';
                updateContent(); // Initial content update

                const urlParams = new URLSearchParams(window.location.search);
                const idFromUrl = urlParams.get('id');
                if (idFromUrl) {
                    document.getElementById('card-id-input').value = idFromUrl;
                    window.checkStatus();
                } else {
                    document.getElementById('status-message').textContent = TRANSLATIONS[currentLang].status_initial;
                }
            } catch (error) {
                const statusElement = document.getElementById('status-message');
                if (statusElement) statusElement.textContent = `${TRANSLATIONS[currentLang].status_fetch_error} (${error.code})`;
                if (statusElement) statusElement.className = 'text-center mb-4 font-semibold text-sm text-red-600';
                console.error("Firebase Auth Error:", error);
            }
        }
        
        window.checkStatus = async function() {
            const cardId = document.getElementById('card-id-input').value.trim().toUpperCase();
            const statusElement = document.getElementById('status-message');
            const resultArea = document.getElementById('result-area');
            const cardArea = document.getElementById('card-area');
            const printButton = document.getElementById('print-card-button');
            const t = TRANSLATIONS[currentLang];
            
            if (statusElement) {
                 statusElement.textContent = '';
                 statusElement.className = 'text-center mb-4 font-semibold text-sm text-gray-600';
            }
            if (resultArea) resultArea.classList.add('hidden');
            if (cardArea) cardArea.innerHTML = '';
            if (printButton) printButton.classList.add('hidden');
            
            currentMemberData = null;

            if (!cardId) {
                if (statusElement) statusElement.textContent = t.status_missing_id;
                return;
            }

            if (statusElement) statusElement.textContent = t.status_checking;
            
            try {
                const membersRef = collection(db, `artifacts/${appId}/public/data/members`);
                const q = query(membersRef, where('cardId', '==', cardId));
                const querySnapshot = await getDocs(q);
                
                if (querySnapshot.empty) {
                    if (statusElement) statusElement.textContent = t.status_not_found;
                    return;
                }
                
                const data = querySnapshot.docs[0].data();
                currentMemberData = data;
                
                if (resultArea) resultArea.classList.remove('hidden');

                if (data.status === 'Pending') {
                    if (statusElement) statusElement.innerHTML = `<span class="text-amber-600 font-bold">${t.status_pending}</span>`;
                
                } else if (data.status === 'Cancelled' || data.status === 'Rejected') {
                    const reason = data.cancellationReason || t.status_contact;
                    if (statusElement) statusElement.innerHTML = `
                        <span class="text-red-600 font-bold">${t.status_rejected}</span><br>
                        <span class="text-gray-700 text-sm mt-1 block">${t.status_reason} ${reason}</span>
                    `;

                } else if (data.status === 'Approved') {
                    if (statusElement) statusElement.innerHTML = `<span class="text-green-600 font-bold">${t.status_approved}</span>`;
                    if (printButton) printButton.classList.remove('hidden');
                    window.renderCard(data); 
                }

            } catch (error) {
                console.error("Error fetching data:", error);
                if (statusElement) statusElement.textContent = `${t.status_fetch_error}. (${error.message})`;
            }
        };

        window.renderCard = function(data) {
            const cardArea = document.getElementById('card-area');
            if (!cardArea) return;
            const t = TRANSLATIONS[currentLang];
            
            const approvedDateStr = formatDate(data.approvedDate);
            const expiryDateStr = formatDate(data.expiryDate);
            const dobStr = formatDate(data.dob);
            const align = currentLang === 'sd' ? 'text-right' : 'text-left';

            cardArea.innerHTML = `
                <div class="card-container" id="membership-card-to-print">
                    
                    <!-- Card Header -->
                    <div class="card-header">
                         <img src="https://raw.githubusercontent.com/waqasmangi/Nirmal-Library/37112ca6d5127e34450b8e6ad5041962e5240167/1000359794-removebg-preview.png" 
                            alt="Nirmal Logo" 
                            class="card-header-logo">
                        <div>
                            <h2 class="text-lg font-extrabold leading-none">${t.card_title}</h2>
                            <p class="text-sm">${t.card_subtitle}</p>
                        </div>
                    </div>
                    
                    <!-- Card Body -->
                    <div class="card-body">
                        
                        <div class="card-details-wrapper">
                            <div class="card-details-section">
                                <h3 class="text-sm font-bold text-teal-800 mb-1 ${align}">${t.card_section_title}</h3>
                                <div class="card-details-grid">
                                    <div class="detail-label ${align}">${t.card_name}</div>
                                    <div class="detail-value text-teal-800 font-extrabold ${align}">${data.name}</div>
                                    <div class="detail-label ${align}">${t.card_father}</div>
                                    <div class="detail-value ${align}">${data.fatherName}</div>
                                    <div class="detail-label ${align}">${t.card_occupation}</div>
                                    <div class="detail-value ${align}">${data.occupation}</div>
                                    <div class="detail-label ${align}">${t.card_dob}</div>
                                    <div class="detail-value latin ${align}">${dobStr}</div>
                                    <div class="detail-label ${align}">${t.card_issue_date}</div>
                                    <div class="detail-value latin ${align}">${approvedDateStr}</div>
                                    <div class="detail-label text-red-600 ${align}">${t.card_expiry}</div>
                                    <div class="detail-value latin text-red-600 font-extrabold ${align}">${expiryDateStr}</div>
                                </div>
                            </div>
                            
                            <div class="signature-row">
                                <div class="signature-box">
                                    <div class="signature-line mr-auto"></div>
                                    <p>${t.card_librarian_sign}</p>
                                    <p class="latin text-gray-700">${t.card_librarian_label}</p>
                                </div>
                                <div class="signature-box">
                                    <div class="signature-line ml-auto"></div>
                                    <p>${t.card_student_sign}</p>
                                    <p class="latin text-gray-700">${t.card_student_label}</p>
                                </div>
                            </div>
                        </div>

                        <div class="card-photo-section">
                            <img src="${data.photoBase64}" class="card-photo" alt="${data.name} Photo">
                            <p class="card-id-display latin">${data.cardId}</p>
                            <p class="text-[8px] text-gray-500 mt-0.5">${t.card_id_label}</p>
                        </div>

                    </div>
                    
                    <div class="card-footer">
                        ${t.card_footer}
                    </div>
                </div>
            `;
        };

        window.printCard = function() {
            const cardElement = document.getElementById('membership-card-to-print');
            if (!cardElement) {
                document.getElementById('status-message').textContent = TRANSLATIONS[currentLang].print_error;
                return;
            }

            cardElement.style.transform = 'scale(0.95)'; 
            cardElement.style.transformOrigin = 'top right'; 

            const opt = {
                margin: 5,
                filename: `Nirmal_Jevtani_Library_Card_${currentMemberData.cardId}.pdf`,
                image: { type: 'jpeg', quality: 0.98 },
                html2canvas: { scale: 3 },
                jsPDF: { unit: 'mm', format: 'a4', orientation: 'landscape' },
                pagebreak: { mode: 'avoid-all' }
            };

            html2pdf().from(cardElement).set(opt).save().then(() => {
                cardElement.style.transform = ''; 
                cardElement.style.transformOrigin = ''; 
            });
        };

        document.addEventListener('DOMContentLoaded', initFirebaseAndAuth);
    </script>
</head>
<body class="bg-stone-50 text-gray-800">

    <header class="bg-teal-800 text-white p-4 shadow-md sticky top-0 z-50 no-print">
        <!-- Main Header Line: Logo/Title | Controls (Language Switcher, Admin Icon, Menu Toggle) -->
        <div class="container mx-auto flex justify-between items-center">
            
            <!-- Logo/Title block -->
            <div class="flex items-center">
                 <img src="https://raw.githubusercontent.com/waqasmangi/Nirmal-Library/37112ca6d5127e34450b8e6ad5041962e5240167/1000359794-removebg-preview.png" 
                     alt="Nirmal Library Logo" 
                     class="nirmal-logo-header border-white ml-3">
