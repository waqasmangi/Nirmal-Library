<!-- Chosen Palette: Teal, Amber, Stone (Minimal and Educational) -->
<!-- Application Structure Plan: Dashboard/Portal approach. Chosen structure: Top-level Navigation linking to English Learning (separate page) and Admin Panel (separate page). Main page content is organized vertically (Inventory -> Reviews -> About) for optimal mobile scrolling and centralized information access. This structure simplifies user flow: The main page acts as a hub, and content is dynamically updated via Firestore. -->
<!-- Visualization & Content Choices: Inventory (Report Info -> Organize -> HTML Table + JS Filter -> Search function for usability -> Vanilla JS/HTML). Reviews (Report Info -> Inform -> HTML/CSS Display + JS Firestore Listener -> Clickable Star Rating & Like button for engagement -> Firestore/Vanilla JS). TTS on load (Goal: Engagement/Accessibility -> TTS Welcome Message -> TTS API). CONFIRMATION: NO SVG graphics used. NO Mermaid JS used. -->
<!DOCTYPE html>
<html lang="sd" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>نرمل جيوتاڻي لائبريري، ٿرڙي محبت</title>
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Custom Font: MB Lateefi.otf -->
    <style>
        @font-face {
            font-family: 'MBLateefi';
            src: url('MB Lateefi.otf') format('opentype');
            font-weight: normal;
            font-style: normal;
        }
        body {
            font-family: 'MBLateefi', 'Noto Nastaliq Urdu', serif;
            text-align: center;
        }
        .latin {
            font-family: Inter, sans-serif;
            text-align: left; /* Keep Latin text aligned left */
        }
        .text-right-aligned {
             text-align: right; /* Specific class for right alignment in rtl context */
        }
        .speaker-icon {
            cursor: pointer;
            color: #115e59; /* Teal-700 */
            margin-right: 0.5rem;
        }
        .max-h-96 {
            max-height: 24rem;
        }
        /* New: Responsive Placeholder Styling for better mobile visibility */
        .responsive-placeholder::placeholder {
            font-size: 0.8rem; /* Default small size on mobile */
        }
        @media (min-width: 640px) {
            .responsive-placeholder::placeholder {
                font-size: 1rem; /* Larger size on desktop */
            }
        }
    </style>
    
    <!-- Firebase SDK Imports for Live Feedback System -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getAuth, signInAnonymously } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
        import { getFirestore, collection, addDoc, query, onSnapshot, serverTimestamp, setLogLevel, updateDoc, doc, orderBy } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";
        
        setLogLevel('Debug');
        
        // =========================================================================
        // !!! CRITICAL: FIREBASE CONFIGURATION SETUP (UPDATED WITH YOUR KEYS) !!!
        // =========================================================================
        const firebaseConfig = {
            apiKey: "AIzaSyBxgOhd3y5L7Xl_IzWkuJ02PBlswR9lt5k",
            authDomain: "nirmal-library.firebaseapp.com",
            projectId: "nirmal-library", 
            storageBucket: "nirmal-library.firebasestorage.app",
            messagingSenderId: "157338670869",
            appId: "1:157338670869:web:f44c9b0a3d9e9ebedcfb1c"
        };
        const appId = firebaseConfig.projectId;
        // =========================================================================

        let userName = sessionStorage.getItem('userName') || "اڻڄاتل";
        let userId = ''; 
        let db;
        let auth;
        let bookInventoryData = []; 
        
        // --- TTS Helper Function ---
        window.speakText = function(text) {
            if ('speechSynthesis' in window) {
                const voices = speechSynthesis.getVoices();
                const utterance = new SpeechSynthesisUtterance(text);
                const enVoice = voices.find(voice => voice.lang === 'en-US' || voice.lang.startsWith('en'));
                if (enVoice) {
                    utterance.voice = enVoice;
                } else {
                    utterance.lang = 'en-US'; 
                }
                speechSynthesis.speak(utterance);
            } else {
                console.error("TTS not supported.");
            }
        };

        window.changeUserName = function() {
            let newName = null;
            let currentName = sessionStorage.getItem('userName') || '';

            do {
                newName = prompt("مهرباني ڪري پنهنجو نالو داخل ڪريو (تبصرو ۽ تجويزون موڪلڻ لاءِ):", currentName);
                if (newName === null) { 
                    return;
                }
                newName = newName.trim();
                if (newName === '') {
                    alert("نالو خالي نٿو ٿي سگھي. مهرباني ڪري نالو داخل ڪريو.");
                }
            } while (newName === '');

            userName = newName;
            sessionStorage.setItem('userName', userName);
            document.getElementById('user-name-display').textContent = userName;
            // Re-initialize to ensure the new user name is ready for submissions
            if (db) initFirebaseAndAuth(); 
        };
        
        window.toggleLike = async function(docId, currentLikes) {
            if (!userId) {
                alert("مهرباني ڪري انتظار ڪريو جيستائين سسٽم ڊيٽابيس سان ڳنڍي وڃي.");
                return;
            }
            
            const reviewRef = doc(db, `artifacts/${appId}/public/data/reviews`, docId);
            
            try {
                await updateDoc(reviewRef, {
                    likes: currentLikes + 1
                });
            } catch (e) {
                console.error("Error updating document (Like): ", e);
                alert(`لائڪ موڪلڻ ۾ غلطي ٿي (Permissions Issue): ${e.message}.`);
            }
        };
        
        window.shareOnWhatsApp = function(message) {
            const websiteLink = window.location.href.split('?')[0]; 
            const fullMessage = encodeURIComponent(`${message}\n\n[نِرمل لائبريري ويبسائيٽ]\n${websiteLink}`);
            window.open(`whatsapp://send?text=${fullMessage}`, '_blank');
        };

        window.shareReview = function(text, rating) {
            const stars = '★'.repeat(rating) + '☆'.repeat(5 - rating);
            const message = `📚 نئون تبصرو: ${userName} طرفان\nدرجه بندي: ${stars}\nروايو: ${text}\n`;
            window.shareOnWhatsApp(message);
        };
        
        window.shareSuggestion = function(level, changes, topic) {
            // Level is now static placeholder 'مقرر نه ڪيل' in this function since the field was removed from the form
            const levelText = level === 'مقرر نه ڪيل' ? 'تياري جي سطح مقرر نه ڪئي وئي' : level; 
            const message = `💡 نئين ترقي جي تجويز: ${userName} طرفان\n- تياري جي سطح: ${levelText}\n- تبديلي گهربل: ${changes}\n- سکڻ جو نئون موضوع: ${topic}\n`;
            window.shareOnWhatsApp(message);
        };

        // --- Firebase Initialization and Auth ---
        async function initFirebaseAndAuth() {
            try {
                const app = initializeApp(firebaseConfig);
                db = getFirestore(app);
                auth = getAuth(app);
                
                await signInAnonymously(auth);
                userId = auth.currentUser?.uid || crypto.randomUUID();
                
                document.getElementById('user-name-display').textContent = userName;

                // Start listeners
                listenForReviews(db, appId);
                listenForAdvancedFeedback(db, appId);
                listenForBookInventory(db, appId);

            } catch (error) {
                console.error("Firebase Auth Error:", error);
                userId = crypto.randomUUID();
                const statusElement = document.getElementById('review-status');
                statusElement.textContent = `ڊيٽابيس لوڊ نه ٿي سگھيو. (غلطي: ${error.code}). مهرباني ڪري رولز ۽ Anonymous Auth چالو ڪريو.`;
                statusElement.classList.add('text-red-600');
            }
        }
        
        function getReviewsCollectionRef(db, appId) {
            return collection(db, `artifacts/${appId}/public/data/reviews`);
        }
        
        function getAdvancedFeedbackCollectionRef(db, appId) {
            return collection(db, `artifacts/${appId}/public/data/advancedFeedback`);
        }
        
        function getBookInventoryCollectionRef(db, appId) {
             return collection(db, `artifacts/${appId}/public/data/book_inventory`);
        }
        
        // --- Book Inventory Logic ---
        function listenForBookInventory(db, appId) {
            const booksRef = getBookInventoryCollectionRef(db, appId);
            const q = query(booksRef, orderBy('timestamp', 'desc')); 
            
            onSnapshot(q, (snapshot) => {
                bookInventoryData = snapshot.docs.map(doc => ({
                    id: doc.id,
                    ...doc.data()
                }));
                window.filterInventory(); 
            }, (error) => {
                 console.error("Error listening to book inventory: ", error);
                 document.getElementById('inventory-list-body').innerHTML = `<tr><td colspan="4" class="p-4 text-center text-red-600">فهرست لوڊ نه ٿي سگھي.</td></tr>`;
            });
        }
        
        window.filterInventory = function() {
            const searchTerm = document.getElementById('inventory-search').value.toLowerCase().trim();
            const list = document.getElementById('inventory-list-body');
            list.innerHTML = '';
            
            const filteredData = bookInventoryData.filter(book => 
                (book.title || '').toLowerCase().includes(searchTerm) || 
                (book.category || '').toLowerCase().includes(searchTerm) ||
                (book.author || '').toLowerCase().includes(searchTerm)
            );

            if (filteredData.length === 0) {
                 list.innerHTML = '<tr><td colspan="4" class="p-4 text-center text-gray-500">ڪابه ڪتاب نه ملي سگهي.</td></tr>';
                 return;
            }

            filteredData.forEach((data, index) => {
                const row = document.createElement('tr');
                row.className = index % 2 === 0 ? 'bg-white' : 'bg-stone-50';
                
                row.innerHTML = `
                    <td class="p-4">${index + 1}</td>
                    <td class="p-4 font-semibold text-right-aligned">${data.title}</td>
                    <td class="p-4 text-sm text-gray-700">${data.author || 'نامعلوم'}</td>
                    <td class="p-4 text-sm text-teal-600">${data.category || 'ٻيا'}</td>
                `;
                list.appendChild(row);
            });
        };
        // --- End Book Inventory Logic ---
        
        // --- Review & Suggestion Submission (Formspree & Firestore) ---
        async function sendFormspreeEmail(formId, formData) {
            const formElement = document.getElementById(formId);
            if (!formElement) return;
            try {
                const response = await fetch(formElement.action, {
                    method: 'POST',
                    body: formData,
                    headers: { 'Accept': 'application/json' }
                });
                return response.ok;
            } catch (error) {
                console.error("Error during Formspree submission:", error);
                return false;
            }
        }

        window.submitReview = async function() {
            const rating = document.getElementById('review-rating').value;
            const text = document.getElementById('review-text').value.trim();
            const reviewStatus = document.getElementById('review-status');
            
            if (!rating || !text) { reviewStatus.textContent = 'مھرباني ڪري ريٽنگ ۽ تبصرو ٻئي ڏيو.'; return; }

            reviewStatus.textContent = 'تبصرو موڪلي رهيو آهي...';
            reviewStatus.classList.remove('text-red-600', 'text-green-600');
            reviewStatus.classList.add('text-amber-600');
            
            try {
                // 1. Save to Firestore (for persistent display)
                await addDoc(getReviewsCollectionRef(db, appId), {
                    userName: userName, rating: parseInt(rating, 10), text: text, likes: 0, timestamp: serverTimestamp()
                });
                
                // 2. Send Email via Formspree (for notification)
                const formData = new FormData();
                formData.append('Name', userName);
                formData.append('Rating', `${rating} Stars`);
                formData.append('Review_Text', text);
                formData.append('_subject', `New Student Review: ${userName}`); 
                await sendFormspreeEmail('review-form', formData);

                const safeText = text.replace(/'/g, "\\'").replace(/"/g, '\\"');
                reviewStatus.innerHTML = `
                    <p class="text-green-600 font-semibold">توهان جو تبصرو موڪليو ويو! مهرباني.</p>
                    <button onclick="window.shareReview('${safeText}', ${parseInt(rating, 10)})" class="mt-2 bg-green-500 text-white font-bold py-2 px-4 rounded-full shadow-md hover:bg-green-600 transition-colors flex items-center mx-auto">
                        WhatsApp تي شيئر ڪريو 💬
                    </button>`;
                reviewStatus.classList.remove('text-amber-600', 'text-red-600');
                reviewStatus.classList.add('text-green-600');
                document.getElementById('review-text').value = '';
                document.getElementById('review-rating').value = 5;
            } catch (e) {
                console.error("Error adding document: ", e);
                reviewStatus.textContent = `تبصرو موڪلڻ ۾ غلطي ٿي. (غلطي: Permissions Denied يا Firebase ڪنيڪشن). مھرباني ڪري چيڪ ڪريو.`;
                reviewStatus.classList.remove('text-green-600', 'text-amber-600');
                reviewStatus.classList.add('text-red-600');
            }
        };
        
        window.submitAdvancedFeedback = async function() {
            const changes = document.getElementById('changes-wanted').value.trim();
            const learnMore = document.getElementById('learn-more-topic').value.trim();
            const status = document.getElementById('advanced-feedback-status');
            
            // Modified check: removed check for advanceLevel
            if (!changes || !learnMore) { status.textContent = 'مھرباني ڪري سڀئي خالي جايون ڀريو.'; return; }

            status.textContent = 'رايا موڪلي رهيو آهي...';
            status.classList.remove('text-red-600', 'text-green-600');
            status.classList.add('text-amber-600');
            
            try {
                // 1. Save to Firestore (Removed advanceLevel field)
                await addDoc(getAdvancedFeedbackCollectionRef(db, appId), {
                    userName: userName, changesWanted: changes, learnMoreTopic: learnMore, timestamp: serverTimestamp()
                });
                
                // 2. Send Email via Formspree (Removed advanceLevel field)
                const formData = new FormData();
                formData.append('Name', userName);
                formData.append('Changes_Requested', changes);
                formData.append('Topic_Requested', learnMore);
                formData.append('_subject', `New Advanced Suggestion: ${userName}`); 
                await sendFormspreeEmail('advanced-feedback-form', formData);

            const safeChanges = changes.replace(/'/g, "\\'").replace(/"/g, '\\"');
            const safeTopic = learnMore.replace(/'/g, "\\'").replace(/"/g, '\\"');
            
            // Modified shareSuggestion call (using a static placeholder 'مقرر نه ڪيل' for the removed level)
            status.innerHTML = `<p class="text-green-600 font-semibold">توهان جا تفصيلي رايا موڪليا ويا! مهرباني.</p>
                <button onclick="window.shareSuggestion('مقرر نه ڪيل', '${safeChanges}', '${safeTopic}')" class="mt-2 bg-green-500 text-white font-bold py-2 px-4 rounded-full shadow-md hover:bg-green-600 transition-colors flex items-center mx-auto">
                    WhatsApp تي شيئر ڪريو 💬
                </button>`;

            status.classList.remove('text-amber-600', 'text-red-600');
            status.classList.add('text-green-600');
            document.getElementById('changes-wanted').value = '';
            document.getElementById('learn-more-topic').value = '';
        } catch (e) {
            console.error("Error adding advanced feedback: ", e);
            status.textContent = `رايا موڪلڻ ۾ غلطي ٿي. (غلطي: Permissions Denied يا Firebase ڪنيڪشن). مھرباني ڪري چيڪ ڪريو.`;
            status.classList.remove('text-green-600', 'text-amber-600');
            status.classList.add('text-red-600');
        }
    };
    // --- End Review & Suggestion Submission ---


    function listenForReviews(db, appId) {
        const reviewsRef = getReviewsCollectionRef(db, appId);
        const q = query(reviewsRef, orderBy('timestamp', 'desc')); 
        
        onSnapshot(q, (snapshot) => {
            const reviewsList = document.getElementById('reviews-list');
            reviewsList.innerHTML = '';
            
            let totalRating = 0;
            let reviewCount = 0;

            snapshot.docs.forEach(doc => {
                const data = doc.data();
                const reviewElement = document.createElement('div');
                
                const stars = '★'.repeat(data.rating) + '☆'.repeat(5 - data.rating);
                const userNameDisplay = data.userName || "اڻڄاتل";
                const likesCount = data.likes || 0;

                reviewElement.className = 'bg-white p-4 rounded-lg shadow-sm border border-stone-200 mb-3 text-right-aligned';
                reviewElement.innerHTML = `
                    <div class="flex justify-between items-center mb-2">
                        <p class="text-amber-500 text-xl">${stars}</p>
                        <p class="text-sm text-gray-500 font-bold">${userNameDisplay}</p>
                    </div>
                    <p class="text-gray-700">${data.text}</p>
                    <div class="mt-3 text-right">
                         <button onclick="window.toggleLike('${doc.id}', ${likesCount})" class="text-red-500 hover:text-red-600 transition-colors flex items-center float-left">
                             <span class="mr-1">${likesCount}</span> ♥ 
                         </button>
                    </div>
                `;
                reviewsList.appendChild(reviewElement);

                totalRating += data.rating;
                reviewCount++;
            });

            const avgRating = reviewCount > 0 ? (totalRating / reviewCount).toFixed(1) : 0;
            document.getElementById('average-rating').textContent = `${avgRating} ستارن جي درجه بندي (${reviewCount} تبصرا)`;
            
            if (reviewCount === 0) {
                 reviewsList.innerHTML = '<p class="text-center text-gray-500 mt-4">هتي اڃا تائين ڪو تبصرو ناهي. پھريون تبصرو شامل ڪريو!</p>';
            }
        }, (error) => {
             console.error("Error listening to reviews: ", error);
             document.getElementById('reviews-list').innerHTML = `<p class="text-center text-red-600 mt-4">تبصرو لوڊ نه ٿي سگھيو (انٽرنيٽ/رول چيڪ ڪريو): ${error.message}</p>`;
        });
    }
    
    function listenForAdvancedFeedback(db, appId) {
        const feedbackRef = getAdvancedFeedbackCollectionRef(db, appId);
        const q = q
