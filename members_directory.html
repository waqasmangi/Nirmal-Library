<!DOCTYPE html>
<html lang="sd" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>لائبريري ميمبرز جي ڊائريڪٽري</title>
    <!-- NEW: Favicon (Updated URL) -->
    <link rel="icon" href="https://raw.githubusercontent.com/waqasmangi/Nirmal-Library/37112ca6d5127e34450b8e6ad5041962e5240167/1000359794-removebg-preview.png" type="image/png">
    
    <script src="https://cdn.tailwindcss.com"></script>
    
    <style>
        /* Custom Font */
        @font-face {
            font-family: 'MBLateefi';
            src: url('MB Lateefi.otf') format('opentype');
            font-weight: normal;
            font-style: normal;
        }
        body {
            font-family: 'MBLateefi', 'Noto Nastaliq Urdu', serif;
        }
        .latin {
            font-family: Inter, sans-serif;
        }
        .text-right-aligned {
             text-align: right;
        }
        /* Consolidated Logo Style - FIX APPLIED */
        .nirmal-logo-header {
            width: 55px;
            height: 55px; 
            object-fit: contain; 
            margin-left: 1rem;
            border-radius: 9999px;
            background-color: #fcd34d;
            padding: 2px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
        }
        .member-photo {
            width: 80px;
            height: 80px;
            object-fit: cover;
            border-radius: 50%;
            border: 3px solid #fcd34d;
        }
    </style>

    <!-- Firebase SDK Imports for Data Retrieval -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getAuth, signInAnonymously } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
        import { getFirestore, collection, query, onSnapshot, where, setLogLevel } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";
        
        setLogLevel('Debug');
        
        // --- Shared Firebase Config ---
        const firebaseConfig = {
            apiKey: "AIzaSyBxgOhd3y5L7Xl_IzWkuJ02PBlswR9lt5k",
            authDomain: "nirmal-library.firebaseapp.com",
            projectId: "nirmal-library", 
            storageBucket: "nirmal-library.firebasestorage.app",
            messagingSenderId: "157338670869",
            appId: "1:157338670869:web:f44c9b0a3d9e9ebedcfb1c"
        };
        const appId = firebaseConfig.projectId;
        // --- End Shared Firebase Config ---

        let db;
        let auth;
        
        const formatDate = (timestamp) => {
            if (!timestamp) return 'نامعلوم';
            const date = timestamp.toDate ? timestamp.toDate() : new Date(timestamp);
            return date.toLocaleDateString('sd-PK');
        };

        function sortMembers(members) {
             return members.sort((a, b) => {
                 const dateA = a.approvedDate ? a.approvedDate.toDate().getTime() : 0;
                 const dateB = b.approvedDate ? b.approvedDate.toDate().getTime() : 0;
                 return dateB - dateA; 
             });
        }

        async function initFirebaseAndAuth() {
            try {
                const app = initializeApp(firebaseConfig);
                db = getFirestore(app);
                auth = getAuth(app);
                await signInAnonymously(auth);
                listenForApprovedMembers(db, appId);
            } catch (error) {
                document.getElementById('directory-list').innerHTML = `<p class="text-center text-red-600 mt-4">ڊيٽابيس لوڊ ڪرڻ ۾ غلطي. (${error.code})</p>`;
                console.error("Firebase Auth Error:", error);
            }
        }

        function listenForApprovedMembers(db, appId) {
            const membersRef = collection(db, `artifacts/${appId}/public/data/members`);
            const q = query(membersRef, where('status', '==', 'Approved')); 
            
            onSnapshot(q, (snapshot) => {
                const directoryList = document.getElementById('directory-list');
                directoryList.innerHTML = '';
                
                if (snapshot.empty) {
                     directoryList.innerHTML = '<p class="text-center text-gray-500 mt-8 text-xl">اڃا تائين ڪو به منظور ٿيل ميمبر ناهي.</p>';
                     return;
                }

                let approvedMembers = snapshot.docs.map(doc => doc.data());
                approvedMembers = sortMembers(approvedMembers);

                approvedMembers.forEach(data => {
                    const approvedDate = formatDate(data.approvedDate || data.memberSince);

                    const memberCard = document.createElement('div');
                    memberCard.className = 'bg-white p-6 rounded-lg shadow-md border-b-4 border-teal-500 flex flex-col items-center text-center';
                    
                    memberCard.innerHTML = `
                        <img src="${data.photoBase64 || 'https://placehold.co/80x80/0d3b38/fff?text=N/A'}" alt="${data.name} Photo" class="member-photo mb-3">
                        <h3 class="text-xl font-bold text-teal-700">${data.name}</h3>
                        <p class="text-sm text-gray-600 mb-2">${data.occupation}</p>
                        <p class="text-xs text-amber-600 font-semibold">ميمبر بڻجڻ جي تاريخ:</p>
                        <p class="text-sm text-gray-500">${approvedDate}</p>
                    `;
                    directoryList.appendChild(memberCard);
                });
            }, (error) => {
                 console.error("Error listening to approved members: ", error);
                 document.getElementById('directory-list').innerHTML = `<p class="text-center text-red-600 mt-4">ميمبرز جي ڊيٽا لوڊ نه ٿي سگھي. (${error.message})</p>`;
            });
        }

        document.addEventListener('DOMContentLoaded', initFirebaseAndAuth);
    </script>
</head>
<body class="bg-stone-50 text-gray-800 p-4 md:p-8">

    <div class="container mx-auto max-w-4xl">
        <header class="text-center mb-10 pb-4 border-b-2 border-teal-500">
            <a href="index.html" class="text-sm text-blue-600 hover:text-blue-800 transition-colors flex items-center justify-start mb-4">← مکيه پورٽل ڏانهن واپس</a>
            
             <!-- UPDATED: Header with Nirmal Image and Raw URL -->
            <div class="flex items-center justify-center">
                 <img src="https://raw.githubusercontent.com/waqasmangi/Nirmal-Library/37112ca6d5127e34450b8e6ad5041962e5240167/1000359794-removebg-preview.png" 
                     alt="Nirmal Library Logo" 
                     class="nirmal-logo-header border-teal-600">
                <div>
                    <h1 class="text-4xl font-bold text-teal-700">نِرمل جيوتاڻي لائبريري ميمبرز جي ڊائريڪٽري</h1>
                    <p class="mt-2 text-gray-600">آزاد منگي فائونڊيشن | منظور ٿيل لائبريري ميمبرز جي فهرست.</p>
                </div>
            </div>
            
        </header>

        <div id="directory-list" class="grid grid-cols-2 sm:grid-cols-3 lg:grid-cols-4 gap-6">
            <p class="text-center text-gray-500 col-span-full">لوڊ ٿي رهيو آهي...</p>
        </div>
        
    </div>
</body>
</html>
